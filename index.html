                      <input type="file" accept="application/json,.json" style={{ display: "none" }}
                             onChange={(e) => {
                               const f = e.target.files && e.target.files[0];
                               if (!f) return;
                               const rd = new FileReader();
                               rd.onload = () => setTransfer(t => ({ ...t, text: String(rd.result) }));
                               rd.readAsText(f);
                               e.target.value = "";
                             }} />
                    </label>
                    <span style={{ display: "flex", gap: "8px" }}>
                      <button onClick={() => setTransfer(null)} style={BTN}>Cancel</button>
                      <button disabled={!transfer.text.trim()}
                              onClick={() => { const fn = transfer.onLoad; const txt = transfer.text;
                                               setTransfer(null); fn(txt); }}
                              style={{ ...BTN, borderColor: "#065F46", color: "#6EE7B7",
                                       opacity: transfer.text.trim() ? 1 : 0.4 }}>Load</button>
                    </span>
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {pendingSeason && (
          <div style={{ background: "rgba(245,158,11,0.13)", border: "1px solid #B45309", borderRadius: "8px", padding: "10px 12px", marginBottom: "12px", fontSize: "13px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px" }}>
            <span>Switching to {(packs.find(p => p.id === pendingSeason) || {}).name} clears your {waypoints.length} waypoint{waypoints.length > 1 ? "s" : ""} — the fields differ, so they wouldn't be meaningful.</span>
            <span style={{ display: "flex", gap: "6px", flexShrink: 0 }}>
              <button onClick={() => commitSeason(pendingSeason)} style={{ ...BTN, borderColor: "#B45309", color: "#FBBF24" }}>Switch anyway</button>
              <button onClick={() => setPendingSeason(null)} style={BTN}>Cancel</button>
            </span>
          </div>
        )}

        {notice && (
          <div style={{ background: notice.bad ? "rgba(239,68,68,0.13)" : "rgba(16,185,129,0.12)", border: `1px solid ${notice.bad ? "#7f1d1d" : "#065F46"}`, borderRadius: "8px", padding: "9px 12px", marginBottom: "12px", fontSize: "13px", display: "flex", justifyContent: "space-between", gap: "12px", color: notice.bad ? "#fca5a5" : "#6EE7B7" }}>
            <span>{notice.msg}</span>
            <button onClick={() => setNotice(null)} style={{ ...BTN, padding: "1px 8px" }}>×</button>
          </div>
        )}

        <div style={{ display: "flex", gap: "4px", marginBottom: "1rem", borderBottom: "1px solid #3f3f46", paddingBottom: "8px", flexWrap: "wrap" }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ background: tab === t.id ? "#27272a" : "transparent", border: tab === t.id ? "1px solid #3f3f46" : "1px solid transparent", padding: "6px 14px", borderRadius: "6px", cursor: "pointer", fontSize: "13px", fontWeight: tab === t.id ? 500 : 400, color: "#fafafa" }}>{t.label}</button>
          ))}
        </div>

        {tab === "path" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 250px", gap: "16px" }}>
            <div style={CARD}>
              {insertAfter !== null && (
                <div style={{ background: "rgba(16,185,129,0.15)", border: "1px solid #10B981", borderRadius: "6px", padding: "6px 10px", marginBottom: "8px", fontSize: "12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span>Click the field to insert after #{insertAfter + 1}</span>
                  <button onClick={() => setInsertAfter(null)} style={{ ...BTN, padding: "2px 8px" }}>Cancel</button>
                </div>
              )}
              <svg ref={svgRef} viewBox={`0 0 ${VIEW} ${VIEW}`} style={{ display: "block", cursor: "crosshair", width: "100%", height: "auto" }} onClick={handleFieldClick}>
                <rect width={VIEW} height={VIEW} fill="#1a1a1e" />
                {renderAreas()}
                <rect x={MARGIN} y={MARGIN} width={FIELD * SCALE} height={FIELD * SCALE} fill="#242428" stroke="#52525b" strokeWidth="2" style={{ pointerEvents: "none" }} />
                {showGrid && renderTiles()}
                {showZones && renderPolys()}
                {showZones && renderRects()}
                {showZones && renderTape()}
                {renderMarkers()}
                {renderTags()}
                {renderPath()}
                <text x={MARGIN + FIELD * SCALE / 2} y={VIEW - 8} textAnchor="middle" fill="#71717a" fontSize="10" fontWeight="600" letterSpacing="1" style={{ pointerEvents: "none" }}>{season.audienceLabel}</text>
              </svg>
              <div style={{ fontSize: "11px", color: "#71717a", marginTop: "8px", textAlign: "center" }}>Click empty field to add • Click a point to edit • Drag to move</div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <div style={{ ...CARD, border: selection.type === "start" ? "1px solid #F59E0B" : "1px solid #3f3f46" }}>
                <div onClick={() => setSelection({ type: "start" })} style={{ fontSize: "12px", fontWeight: 500, marginBottom: "10px", color: "#FBBF24", cursor: "pointer", display: "flex", alignItems: "center", gap: "6px" }}>
                  <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: "18px", height: "18px", borderRadius: "4px", background: "#B45309", color: "white", fontSize: "10px", fontWeight: "bold" }}>S</span>
                  Starting position
                </div>
                {!startLegal ? (
                  <div style={{ background: "rgba(239,68,68,0.15)", border: "1px solid #7f1d1d", borderRadius: "5px", padding: "6px 8px", marginBottom: "10px", fontSize: "11px", color: "#fca5a5", lineHeight: 1.6 }}>
                    {startIssues.map((s, i) => <div key={i}>⚠ {s}</div>)}
                  </div>
                ) : (
                  <div style={{ background: "rgba(16,185,129,0.12)", border: "1px solid #065F46", borderRadius: "5px", padding: "5px 8px", marginBottom: "10px", fontSize: "11px", color: "#6EE7B7" }}>✓ Legal start</div>
                )}
                <div style={{ marginBottom: "10px" }}>
                  <label style={LB}>Preset</label>
                  <select value={startPreset} onChange={(e) => applyPreset(e.target.value)} style={IN}>
                    {presets.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </select>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "10px" }}>
                  <NumField label="X (in)" value={startPose.x} step={0.5} onChange={(v) => updateStart("x", clamp(v))} />
                  <NumField label="Y (in)" value={startPose.y} step={0.5} onChange={(v) => updateStart("y", clamp(v))} />
                </div>
                <label style={LB}>Heading (0 = away from audience)</label>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <input type="range" min="0" max="359" value={startPose.heading} onChange={(e) => updateStart("heading", Number(e.target.value))} style={{ flex: 1 }} />
                  <span style={{ fontSize: "12px", minWidth: "34px" }}>{startPose.heading}°</span>
                </div>
              </div>

              {selectedWp && (
                <div style={{ ...CARD, border: "1px solid #10B981" }}>
                  <div style={{ fontSize: "12px", fontWeight: 500, marginBottom: "10px", color: "#34D399", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>Waypoint {selIdx + 1}</span>
                    <span style={{ display: "flex", gap: "4px" }}>
                      <button onClick={() => moveWaypoint(selIdx, -1)} disabled={selIdx === 0} style={{ ...BTN, padding: "1px 7px", opacity: selIdx === 0 ? 0.4 : 1 }}>↑</button>
                      <button onClick={() => moveWaypoint(selIdx, 1)} disabled={selIdx === waypoints.length - 1} style={{ ...BTN, padding: "1px 7px", opacity: selIdx === waypoints.length - 1 ? 0.4 : 1 }}>↓</button>
                    </span>
                  </div>
                  {wpBlocked[selectedWp.id] && <div style={{ background: "rgba(239,68,68,0.15)", border: "1px solid #7f1d1d", borderRadius: "5px", padding: "6px 8px", marginBottom: "10px", fontSize: "11px", color: "#fca5a5" }}>⚠ Robot overlaps the {wpBlocked[selectedWp.id]}</div>}
                  {!wpBlocked[selectedWp.id] && legBlocked[selectedWp.id] && <div style={{ background: "rgba(245,158,11,0.13)", border: "1px solid #B45309", borderRadius: "5px", padding: "6px 8px", marginBottom: "10px", fontSize: "11px", color: "#FBBF24" }}>⚠ The path into this waypoint passes through the {legBlocked[selectedWp.id]}</div>}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "10px" }}>
                    <NumField label="X (in)" value={selectedWp.x} step={0.5} onChange={(v) => updateWaypoint(selectedWp.id, "x", clamp(v))} />
                    <NumField label="Y (in)" value={selectedWp.y} step={0.5} onChange={(v) => updateWaypoint(selectedWp.id, "y", clamp(v))} />
                  </div>
                  <label style={LB}>Heading (°)</label>
                  <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "10px" }}>
                    <input type="range" min="0" max="359" value={selectedWp.heading} onChange={(e) => updateWaypoint(selectedWp.id, "heading", Number(e.target.value))} style={{ flex: 1 }} />
                    <span style={{ fontSize: "12px", minWidth: "34px" }}>{selectedWp.heading}°</span>
                  </div>
                  <div style={{ marginBottom: "10px" }}>
                    <label style={LB}>Action</label>
                    <select value={selectedWp.action} style={IN} onChange={(e) => updateWaypoint(selectedWp.id, "action", e.target.value)}>
                      {visibleActions.map(a => <option key={a.id} value={a.id}>{a.icon} {a.label}</option>)}
                    </select>
                  </div>
                  {renderActionParams(selectedWp)}
                  <div style={{ fontSize: "11px", color: "#71717a", marginBottom: "8px" }}>
                    Leg ≈ {timing.legs[selIdx] ? timing.legs[selIdx].move.toFixed(1) : "0.0"}s
                    {timing.legs[selIdx] && timing.legs[selIdx].action > 0 ? ` + ${timing.legs[selIdx].action.toFixed(1)}s action` : ""}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px" }}>
                    <button onClick={() => setInsertAfter(selIdx)} style={{ ...BTN, fontSize: "11px" }}>➕ Insert after</button>
                    <button onClick={() => duplicateWaypoint(selIdx)} style={{ ...BTN, fontSize: "11px" }}>⧉ Duplicate</button>
                  </div>
                  <button onClick={() => deleteWaypoint(selectedWp.id)} style={{ marginTop: "6px", width: "100%", fontSize: "12px", background: "transparent", color: "#f87171", border: "1px solid #7f1d1d", borderRadius: "6px", padding: "6px", cursor: "pointer" }}>🗑️ Delete waypoint</button>
                </div>
              )}

              <div style={CARD}>
                <div style={{ fontSize: "12px", fontWeight: 500, marginBottom: "8px", color: "#a1a1aa" }}>Display</div>
                {[["Show tile grid", showGrid, setShowGrid], ["Show zones", showZones, setShowZones], ["Show game pieces", showArtifacts, setShowArtifacts], ["Dim opponent", dimOpponent, setDimOpponent]].map(([lbl, val, set]) => (
                  <label key={lbl} style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", marginBottom: "6px", cursor: "pointer" }}>
                    <input type="checkbox" checked={val} onChange={(e) => set(e.target.checked)} /> {lbl}
                  </label>
                ))}
                <label style={{ ...LB, marginTop: "6px" }}>Robot size</label>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <input type="range" min="12" max="18" value={robotSize} onChange={(e) => setRobotSize(Number(e.target.value))} style={{ flex: 1 }} />
                  <span style={{ fontSize: "12px", minWidth: "30px" }}>{robotSize}"</span>
                </div>
              </div>

              <div style={CARD}>
                <div style={{ fontSize: "12px", fontWeight: 500, marginBottom: "8px", color: "#a1a1aa" }}>Path stats</div>
                <div style={{ fontSize: "13px", lineHeight: 1.7 }}>
                  <div>Waypoints: <strong>{waypoints.length}</strong></div>
                  <div>Distance: <strong>{[startPose, ...waypoints].reduce((acc, p, i, arr) => i ? acc + Math.hypot(p.x - arr[i - 1].x, p.y - arr[i - 1].y) : 0, 0).toFixed(1)}"</strong></div>
                  <div style={{ color: overBudget ? "#f87171" : "#fafafa" }}>
                    Est. time: <strong>{timing.total.toFixed(1)}s</strong>{budget ? ` / ${budget}s` : ""}
                  </div>
                  {A.tag && <div>Your tag: <strong>{A.tag}</strong></div>}
                  {season.obstacles.length > 0 && (
                    <div style={{ color: (blockedCount || legBlockedCount) ? "#f87171" : "#6EE7B7" }}>
                      {blockedCount || legBlockedCount
                        ? `⚠ ${blockedCount} point${blockedCount === 1 ? "" : "s"}, ${legBlockedCount} leg${legBlockedCount === 1 ? "" : "s"} blocked`
                        : "✓ No collisions"}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}

        {tab === "waypoints" && (
          <div style={{ ...CARD, borderRadius: "12px", padding: "16px" }}>
            <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", minWidth: "660px", fontSize: "13px", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: "1px solid #3f3f46" }}>
                  {["#", "X", "Y", "Heading", "Action", "Time"].map(h => <th key={h} style={{ textAlign: "left", padding: "8px 4px", fontWeight: 500 }}>{h}</th>)}
                  <th style={{ textAlign: "right", padding: "8px 4px", fontWeight: 500, whiteSpace: "nowrap" }}>Edit</th>
                </tr>
              </thead>
              <tbody>
                <tr onClick={() => setSelection({ type: "start" })} style={{ borderBottom: "1px solid #3f3f46", cursor: "pointer", background: selection.type === "start" ? "rgba(245,158,11,0.15)" : "transparent" }}>
                  <td style={{ padding: "8px 4px" }}><span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: "24px", height: "24px", borderRadius: "6px", background: "#B45309", color: "white", fontSize: "11px", fontWeight: "bold" }}>S</span></td>
                  <td style={{ padding: "8px 4px" }}><input type="number" step="0.5" value={startPose.x} onClick={(e) => e.stopPropagation()} onChange={(e) => updateStart("x", clamp(Number(e.target.value)))} style={{ ...IN, width: "64px" }} /></td>
                  <td style={{ padding: "8px 4px" }}><input type="number" step="0.5" value={startPose.y} onClick={(e) => e.stopPropagation()} onChange={(e) => updateStart("y", clamp(Number(e.target.value)))} style={{ ...IN, width: "64px" }} /></td>
                  <td style={{ padding: "8px 4px" }}><input type="number" step="1" min="0" max="359" value={startPose.heading} onClick={(e) => e.stopPropagation()} onChange={(e) => updateStart("heading", Number(e.target.value))} style={{ ...IN, width: "58px" }} /></td>
                  <td style={{ padding: "8px 4px", color: startLegal ? "#a1a1aa" : "#f87171", fontSize: "12px" }}>{startLegal ? "Starting position" : startIssues[0]}</td>
                  <td style={{ padding: "8px 4px", color: "#71717a", fontSize: "12px" }}>0.0s</td>
                  <td style={{ padding: "8px 4px", textAlign: "right", color: "#71717a", fontSize: "11px" }}>locked</td>
                </tr>
                {waypoints.map((wp, i) => {
                  const sel = selection.type === "wp" && selection.id === wp.id;
                  const bad = wpBlocked[wp.id]; const legBad = legBlocked[wp.id];
                  const lg = timing.legs[i];
                  return (
                    <tr key={wp.id} onClick={() => setSelection({ type: "wp", id: wp.id })} title={bad ? `Overlaps the ${bad}` : (legBad ? `Path passes through the ${legBad}` : "")}
                        style={{ borderBottom: "1px solid #3f3f46", cursor: "pointer", background: bad ? "rgba(239,68,68,0.13)" : (legBad ? "rgba(245,158,11,0.10)" : (sel ? "rgba(16,185,129,0.15)" : "transparent")) }}>
                      <td style={{ padding: "8px 4px" }}><span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: "24px", height: "24px", borderRadius: "50%", background: bad ? "#B91C1C" : (legBad ? "#B45309" : "#10B981"), color: "white", fontSize: "11px", fontWeight: "bold" }}>{i + 1}</span></td>
                      <td style={{ padding: "8px 4px" }}><input type="number" step="0.5" value={wp.x} onClick={(e) => e.stopPropagation()} onChange={(e) => updateWaypoint(wp.id, "x", clamp(Number(e.target.value)))} style={{ ...IN, width: "64px" }} /></td>
                      <td style={{ padding: "8px 4px" }}><input type="number" step="0.5" value={wp.y} onClick={(e) => e.stopPropagation()} onChange={(e) => updateWaypoint(wp.id, "y", clamp(Number(e.target.value)))} style={{ ...IN, width: "64px" }} /></td>
                      <td style={{ padding: "8px 4px" }}><input type="number" step="1" min="0" max="359" value={wp.heading} onClick={(e) => e.stopPropagation()} onChange={(e) => updateWaypoint(wp.id, "heading", Number(e.target.value))} style={{ ...IN, width: "58px" }} /></td>
                      <td style={{ padding: "8px 4px" }}>
                        <select value={wp.action} onClick={(e) => e.stopPropagation()} onChange={(e) => updateWaypoint(wp.id, "action", e.target.value)} style={{ ...IN, width: "148px" }}>
                          {visibleActions.map(a => <option key={a.id} value={a.id}>{a.icon} {a.label}</option>)}
                        </select>
                      </td>
                      <td style={{ padding: "8px 4px", fontSize: "12px", color: "#a1a1aa" }}>{lg ? `${(lg.move + lg.action).toFixed(1)}s` : "-"}</td>
                      <td style={{ padding: "8px 4px", textAlign: "right", whiteSpace: "nowrap", width: "1%" }}>
                        <button onClick={(e) => { e.stopPropagation(); moveWaypoint(i, -1); }} disabled={i === 0} style={{ ...BTN, padding: "2px 7px", marginRight: "3px", opacity: i === 0 ? 0.4 : 1 }}>↑</button>
                        <button onClick={(e) => { e.stopPropagation(); moveWaypoint(i, 1); }} disabled={i === waypoints.length - 1} style={{ ...BTN, padding: "2px 7px", marginRight: "3px", opacity: i === waypoints.length - 1 ? 0.4 : 1 }}>↓</button>
                        <button onClick={(e) => { e.stopPropagation(); duplicateWaypoint(i); }} style={{ ...BTN, padding: "2px 7px", marginRight: "3px" }}>⧉</button>
                        <button onClick={(e) => { e.stopPropagation(); deleteWaypoint(wp.id); }} style={{ ...BTN, padding: "2px 8px", color: "#f87171", borderColor: "#7f1d1d" }}>×</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            </div>
            {waypoints.length > 0 && (
              <div style={{ marginTop: "12px", paddingTop: "10px", borderTop: "1px solid #3f3f46", fontSize: "13px", display: "flex", justifyContent: "space-between" }}>
                <span style={{ color: "#a1a1aa" }}>Total</span>
                <span style={{ color: overBudget ? "#f87171" : "#6EE7B7", fontWeight: 500 }}>
                  {timing.total.toFixed(1)}s{budget ? ` of ${budget}s AUTO` : ""}{overBudget ? " — over budget" : ""}
                </span>
              </div>
            )}
            {waypoints.length === 0 && <div style={{ textAlign: "center", padding: "1.5rem", color: "#71717a", fontSize: "13px" }}>Set your start position above, then click the field to add waypoints.</div>}
          </div>
        )}

        {tab === "motion" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <div style={CARD}>
                <div style={{ fontSize: "13px", fontWeight: 500, marginBottom: "4px" }}>Stop-at-waypoint model</div>
                <div style={{ fontSize: "11.5px", color: "#a1a1aa", lineHeight: 1.65, marginBottom: "12px" }}>
                  Each leg accelerates, cruises, decelerates, and settles inside tolerance before the next begins.
                  Translation and rotation run together, so a leg costs whichever takes longer.
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                  <NumField label="Max velocity" value={motion.maxVelocity} step={1} min={1} suffix="in/s" onChange={(v) => setM("maxVelocity", v)} />
                  <NumField label="Max accel" value={motion.maxAccel} step={5} min={1} suffix="in/s²" onChange={(v) => setM("maxAccel", v)} />
                  <NumField label="Turn rate" value={motion.turnRate} step={10} min={1} suffix="°/s" onChange={(v) => setM("turnRate", v)} />
                  <NumField label="Settle time" value={motion.settleTime} step={0.05} min={0} suffix="s" onChange={(v) => setM("settleTime", v)} />
                </div>
              </div>

              <div style={CARD}>
                <div style={{ fontSize: "13px", fontWeight: 500, marginBottom: "10px" }}>Tolerances &amp; limits</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                  <NumField label="Position tolerance" value={motion.posTolerance} step={0.1} min={0.1} suffix="in" onChange={(v) => setM("posTolerance", v)} />
                  <NumField label="Heading tolerance" value={motion.headingTolerance} step={0.5} min={0.1} suffix="°" onChange={(v) => setM("headingTolerance", v)} />
                  <NumField label="Runaway margin" value={motion.runawayMargin} step={1} min={1} suffix="in" onChange={(v) => setM("runawayMargin", v)} />
                  <div />
                  <NumField label="Timeout base" value={motion.timeoutBase} step={0.25} min={0} suffix="s" onChange={(v) => setM("timeoutBase", v)} />
                  <NumField label="Timeout factor" value={motion.timeoutFactor} step={0.25} min={1} suffix="x" onChange={(v) => setM("timeoutFactor", v)} />
                  <NumField label="Min power" value={motion.minPower} step={0.01} min={0} max={1} onChange={(v) => setM("minPower", v)} />
                  <NumField label="Max power" value={motion.maxPower} step={0.05} min={0} max={1} onChange={(v) => setM("maxPower", v)} />
                </div>
                <div style={{ fontSize: "11px", color: "#71717a", marginTop: "8px", lineHeight: 1.6 }}>
                  Min power is the floor needed to overcome static friction near the target — too low and the robot stalls short of tolerance.
                  <br /><br />
                  Each leg gets <em>base + factor × its estimated time</em>, capped at {motion.timeoutCeiling}s. A single flat timeout
                  cannot work: it is either unreachable for a long leg or useless for a short one.
                </div>
              </div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <div style={CARD}>
                <div style={{ fontSize: "13px", fontWeight: 500, marginBottom: "10px" }}>Translation PID</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px" }}>
                  <NumField label="kP" value={motion.transP} step={0.005} onChange={(v) => setM("transP", v)} />
                  <NumField label="kI" value={motion.transI} step={0.001} onChange={(v) => setM("transI", v)} />
                  <NumField label="kD" value={motion.transD} step={0.001} onChange={(v) => setM("transD", v)} />
                </div>
              </div>

              <div style={CARD}>
                <div style={{ fontSize: "13px", fontWeight: 500, marginBottom: "10px" }}>Heading PID</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px" }}>
                  <NumField label="kP" value={motion.headP} step={0.005} onChange={(v) => setM("headP", v)} />
                  <NumField label="kI" value={motion.headI} step={0.001} onChange={(v) => setM("headI", v)} />
                  <NumField label="kD" value={motion.headD} step={0.001} onChange={(v) => setM("headD", v)} />
                </div>
              </div>

              <div style={{ ...CARD, background: "rgba(245,158,11,0.09)", borderColor: "#B45309" }}>
                <div style={{ fontSize: "12px", color: "#FBBF24", fontWeight: 500, marginBottom: "6px" }}>⚠ These are starting guesses, not tuned values</div>
                <div style={{ fontSize: "11.5px", color: "#d4d4d8", lineHeight: 1.65 }}>
                  PID gains cannot be derived on paper — they depend on your robot's mass, wheel grip, and battery state.
                  The defaults are conservative placeholders so the generated code compiles and moves. Real gains come from
                  a field session: raise kP until it oscillates, then back off and add kD. The velocity and accel figures
                  also drive the time estimate, so an untuned robot will not match the predicted runtime.
                </div>
              </div>

              <div style={CARD}>
                <div style={{ fontSize: "12px", fontWeight: 500, marginBottom: "8px", color: "#a1a1aa" }}>Timing check</div>
                <div style={{ fontSize: "13px", lineHeight: 1.8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><span>Legs</span><strong>{timing.legs.reduce((a, l) => a + l.move, 0).toFixed(1)}s</strong></div>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><span>Actions</span><strong>{timing.legs.reduce((a, l) => a + l.action, 0).toFixed(1)}s</strong></div>
                  <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid #3f3f46", marginTop: "4px", paddingTop: "4px", color: overBudget ? "#f87171" : "#6EE7B7" }}>
                    <span>Total</span><strong>{timing.total.toFixed(1)}s{budget ? ` / ${budget}s` : ""}</strong>
                  </div>
                </div>
              </div>

              <button onClick={() => setMotion(DEFAULT_MOTION)} style={BTN}>↺ Reset to defaults</button>
            </div>
          </div>
        )}

        {tab === "code" && (
          <div style={{ ...CARD, borderRadius: "12px", padding: "16px" }}>
            <div style={{ background: "rgba(59,130,246,0.10)", border: "1px solid #1D4ED8", borderRadius: "6px", padding: "8px 10px", marginBottom: "12px", fontSize: "11.5px", color: "#93C5FD", lineHeight: 1.6 }}>
              Self-contained — paste this one file into OnBot Java and build. Odometry, motion, vision, and your
              mechanism macros are all inside the class, so nothing else has to be on the Hub.
              {profile ? "" : " No robot profile loaded, so hardware names and odometry constants are defaults."}
              {profile && profile.odometry && profile.odometry.calibration && profile.odometry.calibration.status === "calibrated"
                ? "" : " Odometry is uncalibrated — run OdometryCalibration and re-export the profile."}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <label style={{ fontSize: "12px", color: "#a1a1aa" }}>Path name</label>
                <input type="text" value={pathName} onChange={(e) => setPathName(e.target.value)}
                       style={{ ...IN, width: "170px" }} placeholder="Blue Depot" />
                <span style={{ fontSize: "11px", color: "#71717a" }}>→ {opModeClassName}.java</span>
              </div>
              <div style={{ display: "flex", gap: "6px" }}>
                <button onClick={() => navigator.clipboard.writeText(generateCode())} style={BTN}>📋 Copy</button>
                <button onClick={() => {
                  try {
                    const blob = new Blob([generateCode()], { type: "text/x-java-source" });
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = `${opModeClassName}.java`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                  } catch {
                    setNotice({ bad: true, msg: "Download is blocked in this preview — use Copy instead." });
                  }
                }} style={BTN}>⬇ .java</button>
              </div>
            </div>
            <pre style={{ background: "#18181b", padding: "12px", borderRadius: "8px", fontSize: "11px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", overflow: "auto", maxHeight: "460px", margin: 0, whiteSpace: "pre-wrap", color: "#d4d4d8" }}>{generateCode()}</pre>
          </div>
        )}

        {tab === "field" && (
          <div style={{ ...CARD, borderRadius: "12px", padding: "16px", fontSize: "13px", lineHeight: 1.8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "12px", marginBottom: "14px" }}>
              <div>
                <h2 style={{ fontSize: "16px", fontWeight: 500, margin: "0 0 4px" }}>{season.name} {season.years}</h2>
                <div style={{ color: "#a1a1aa", fontSize: "12px" }}>Source: {season.source}</div>
              </div>
              <div style={{ display: "flex", gap: "6px", flexShrink: 0 }}>
                <button onClick={exportPack} style={BTN}>💾 Save season pack</button>
                <button onClick={() => openImport("Load season pack", loadPackText)} style={BTN}>📂 Load pack</button>
              </div>
            </div>

            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12.5px" }}>
              <tbody>
                {[
                  ["Format", `pathpilotSeason ${DSL_VERSION}`],
                  ["Field", `${season.field.size}" × ${season.field.size}", ${season.field.tile}" tiles`],
                  ["AUTO period", season.autoSeconds ? `${season.autoSeconds}s` : "not specified"],
                  ["Drawn geometry", `${(G.rects || []).length} rects, ${(G.polygons || []).length} polygons, ${(G.tapeLines || []).length} tape lines, ${(G.markers || []).length} markers`],
                  ["Obstacles", season.obstacles.length ? season.obstacles.map(o => o.name).join(", ") : "none"],
                  ["Launch lines", season.launchLines.length || "none"],
                  ["Start rules", (season.dsl.startRules || []).map(r => r.type).join(", ") || "none"],
                  ["Field tags", season.tags.length ? season.tags.map(t => `${t.id} (${season.alliances[t.owner].label})`).join(", ") : "none"],
                  ["Off-field tags", season.offFieldTags.length ? season.offFieldTags.map(o => `${o.ids} — ${o.note}`).join("; ") : "none"],
                  ["Blue start", season.alliances.blue.startRegion.label],
                  ["Red start", season.alliances.red.startRegion.label],
                  ["Mirror", `${season.mirror.axis} = ${season.mirror.at}`],
                  ["Actions", season.actions.length],
                ].map(([k, v]) => (
                  <tr key={k} style={{ borderBottom: "1px solid #3f3f46" }}>
                    <td style={{ padding: "7px 4px", color: "#a1a1aa", width: "150px", verticalAlign: "top" }}>{k}</td>
                    <td style={{ padding: "7px 4px" }}>{v}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div style={{ marginTop: "16px", padding: "10px 12px", background: "#18181b", borderRadius: "6px", border: "1px solid #3f3f46", fontSize: "12px", color: "#a1a1aa", lineHeight: 1.7 }}>
              <strong style={{ color: "#fafafa", fontWeight: 500 }}>Season packs are pure JSON.</strong><br />
              A pack describes a field — geometry, obstacles, rules, actions — and contains no code, so importing one
              cannot execute anything. Size-dependent values like start presets use arithmetic expressions
              (<code style={{ color: "#FBBF24" }}>"48 + r"</code>), evaluated by a parser that only understands numbers and
              <code style={{ color: "#FBBF24" }}> + − × ÷</code>.
              <br /><br />
              On import, every preset is checked against the pack's own start rules at several robot sizes. Failures are
              reported rather than silently accepted. Authoring a new season still means reading the game manual carefully —
              measurements from figures need a human eye, and a wrong number produces a path that misses rather than an error.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<PathPilot />);

</script>
</body>
</html>
