/* ============================================================================
 * PathPilot — season DSL engine
 * ----------------------------------------------------------------------------
 * A season is pure JSON. No functions, no code. That's what makes a season pack
 * safe to hand to another team: it can only describe a field, never execute.
 *
 * This file holds the interpreter: geometry helpers, a tiny arithmetic
 * evaluator for size-dependent expressions, the rule engine that turns
 * declarative startRules into violation messages, the emit-template renderer,
 * and the stop-at-waypoint timing model.
 *
 * COORDINATES (all seasons): (0,0) is the bottom-left field corner from the
 * audience. +X right, +Y away from the audience. Heading 0 faces +Y, CW positive.
 * ==========================================================================*/

const DSL_VERSION = 1;

/* ------------------------------------------------------------- geometry -- */

const distToSeg = (px, py, x1, y1, x2, y2) => {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
};

const pointInPoly = (px, py, poly) => {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
};

const circleHitsPoly = (cx, cy, r, poly) => {
  if (pointInPoly(cx, cy, poly)) return true;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    if (distToSeg(cx, cy, poly[i][0], poly[i][1], poly[j][0], poly[j][1]) < r) return true;
  }
  return false;
};

const circleNearPolyEdge = (cx, cy, r, poly) => {
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    if (distToSeg(cx, cy, poly[i][0], poly[i][1], poly[j][0], poly[j][1]) <= r) return true;
  }
  return false;
};

/* A swept circle along a segment. Waypoint-only checking misses the case where
 * both endpoints are clear but the straight line between them passes through a
 * structure. Sampled at 1" so a 144" traverse costs ~145 point tests. */
const sweepHitsPoly = (x1, y1, x2, y2, r, poly) => {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(1, Math.ceil(d));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    if (circleHitsPoly(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, r, poly)) return true;
  }
  return false;
};

const shapeToPoly = (shape) => {
  if (shape.type === "rect") {
    const { x, y, width, height } = shape;
    return [[x, y], [x + width, y], [x + width, y + height], [x, y + height]];
  }
  return shape.points;
};

/* --------------------------------------------------- expression evaluator - */
/* Recursive descent over + - * / and parentheses. No eval, no Function — an
 * imported pack can put arithmetic in a preset but cannot run code. */

const evalExpr = (expr, vars) => {
  if (typeof expr === "number") return expr;
  const s = String(expr);
  let i = 0;
  const skip = () => { while (i < s.length && s[i] === " ") i++; };

  const factor = () => {
    skip();
    if (s[i] === "-") { i++; return -factor(); }
    if (s[i] === "+") { i++; return factor(); }
    if (s[i] === "(") {
      i++;
      const v = expression();
      skip();
      if (s[i] !== ")") throw new Error(`expected ) in "${s}"`);
      i++;
      return v;
    }
    const num = /^\d*\.?\d+/.exec(s.slice(i));
    if (num) { i += num[0].length; return parseFloat(num[0]); }
    const id = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
    if (id) {
      i += id[0].length;
      if (!(id[0] in vars)) throw new Error(`unknown variable "${id[0]}" in "${s}"`);
      return vars[id[0]];
    }
    throw new Error(`cannot parse "${s}" at ${i}`);
  };

  const term = () => {
    let v = factor();
    for (;;) {
      skip();
      if (s[i] === "*") { i++; v *= factor(); }
      else if (s[i] === "/") { i++; v /= factor(); }
      else return v;
    }
  };

  const expression = () => {
    let v = term();
    for (;;) {
      skip();
      if (s[i] === "+") { i++; v += term(); }
      else if (s[i] === "-") { i++; v -= term(); }
      else return v;
    }
  };

  const out = expression();
  skip();
  if (i !== s.length) throw new Error(`trailing input in "${s}"`);
  if (!Number.isFinite(out)) throw new Error(`"${s}" is not finite`);
  return out;
};

const exprVars = (dsl, robotSize) => ({
  r: robotSize / 2,
  robotSize,
  size: dsl.field.size,
  field: dsl.field.size,
  tile: dsl.field.tile,
  half: dsl.field.size / 2,
  SQRT2: Math.SQRT2,
  PI: Math.PI,
});

/* -------------------------------------------------------------- compiler - */

const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function compileSeason(dsl) {
  if (dsl.pathpilotSeason !== DSL_VERSION) {
    throw new Error(`season "${dsl.id}" declares format ${dsl.pathpilotSeason}, this build reads ${DSL_VERSION}`);
  }
  for (const k of ["id", "name", "field", "alliances", "mirror", "geometry", "actions"]) {
    if (dsl[k] === undefined) throw new Error(`season "${dsl.id}" missing "${k}"`);
  }

  const S = dsl.field.size;
  const obstacles = (dsl.obstacles || []).map(o => ({ ...o, poly: shapeToPoly(o.shape) }));

  const mirrorPoint = (x, y) =>
    dsl.mirror.axis === "x" ? { x: 2 * dsl.mirror.at - x, y } : { x, y: 2 * dsl.mirror.at - y };
  const mirrorHeading = (h) =>
    dsl.mirror.axis === "x" ? (360 - h) % 360 : (540 - h) % 360;
  const mirrorTag = (id) => {
    const m = dsl.mirror.tagSwap || {};
    return m[id] !== undefined ? m[id] : id;
  };

  /* Presets are authored once for dsl.presetsDefinedFor and mirrored for the
   * other alliance, so the two halves can never drift apart. */
  const getPresets = (alliance, robotSize) => {
    const vars = exprVars(dsl, robotSize);
    const base = dsl.presetsDefinedFor || "blue";
    const flip = alliance !== base;
    const out = (dsl.startPresets || []).map(p => {
      let x = evalExpr(p.x, vars);
      let y = evalExpr(p.y, vars);
      let heading = p.heading;
      if (flip) { const m = mirrorPoint(x, y); x = m.x; y = m.y; heading = mirrorHeading(heading); }
      return {
        id: p.id,
        label: String(p.label)
          .replace(/\{Alliance\}/g, titleCase(dsl.alliances[alliance].label))
          .replace(/\{alliance\}/g, dsl.alliances[alliance].label.toLowerCase()),
        x: +x.toFixed(1), y: +y.toFixed(1), heading,
      };
    });
    out.push({ id: "custom", label: "Custom", x: null, y: null, heading: null });
    return out;
  };

  /* Declarative rule engine. Each entry in startRules names a check type; the
   * message may reference {obstacle} or {region}. */
  const validateStart = (pose, { alliance, robotSize }) => {
    const r = robotSize / 2;
    const { x, y } = pose;
    const issues = [];
    const A = dsl.alliances[alliance];

    for (const rule of dsl.startRules || []) {
      switch (rule.type) {
        case "noOverlap": {
          const grace = rule.grace || 0;
          for (const o of obstacles) {
            if (circleHitsPoly(x, y, r - grace, o.poly))
              issues.push((rule.message || "Robot overlaps the {obstacle}").replace("{obstacle}", o.name));
          }
          break;
        }
        case "withinRegion": {
          const reg = A.startRegion;
          if (!reg) break;
          const bad =
            (reg.xMin !== undefined && x - r < reg.xMin) ||
            (reg.xMax !== undefined && x + r > reg.xMax) ||
            (reg.yMin !== undefined && y - r < reg.yMin) ||
            (reg.yMax !== undefined && y + r > reg.yMax);
          if (bad) issues.push((rule.message || "Outside {region}").replace("{region}", reg.label || "the start region"));
          break;
        }
        case "overAnyLaunchLine": {
          const ok = (dsl.launchLines || []).some(([[x1, y1], [x2, y2]]) => distToSeg(x, y, x1, y1, x2, y2) <= r);
          if (!ok) issues.push(rule.message || "Must be over a launch line");
          break;
        }
        case "touchingAny": {
          let ok = false;
          for (const t of rule.targets || []) {
            if (t === "perimeter" && (x - r <= 0.5 || x + r >= S - 0.5 || y - r <= 0.5 || y + r >= S - 0.5)) ok = true;
            if (t === "ownGoal") {
              const g = obstacles.find(o => o.owner === alliance && o.role === "goal");
              if (g && circleNearPolyEdge(x, y, r + 1, g.poly)) ok = true;
            }
            if (t === "anyStructure") {
              if (obstacles.some(o => circleNearPolyEdge(x, y, r + 1, o.poly))) ok = true;
            }
          }
          if (!ok) issues.push(rule.message || "Must touch a legal surface");
          break;
        }
        case "insideField": {
          if (x - r < 0 || x + r > S || y - r < 0 || y + r > S)
            issues.push(rule.message || "Robot must be fully inside the field");
          break;
        }
        default:
          issues.push(`Unknown rule type "${rule.type}" in season pack`);
      }
    }
    return issues;
  };

  /* Emit templates: "{key}" substitutes a param, "{key:ms}" converts seconds to
   * milliseconds, "@myTag" as a default resolves to the alliance's tag. */
  const renderEmit = (action, params, ctx) => {
    const def = dsl.actions.find(a => a.id === action);
    if (!def || !def.emit) return [];
    const resolve = (key) => {
      let v = params[key];
      if (v === undefined || v === "" || v === null) {
        const p = (def.params || []).find(pp => pp.key === key);
        v = p ? p.default : "";
        if (v === "@myTag") v = ctx.myTag;
      }
      return v;
    };
    return def.emit.map(tpl =>
      tpl.replace(/\{(\w+)(?::(\w+))?\}/g, (_, key, fmt) => {
        const v = resolve(key);
        if (fmt === "ms") return String(Math.round(Number(v) * 1000));
        if (fmt === "int") return String(Math.round(Number(v)));
        return String(v);
      })
    );
  };

  const actionDuration = (action, params) => {
    const def = dsl.actions.find(a => a.id === action);
    if (!def) return 0;
    if (def.durationFrom && params[def.durationFrom] !== undefined) return Number(params[def.durationFrom]) || 0;
    return def.est || 0;
  };

  return {
    dsl,
    id: dsl.id,
    name: dsl.name,
    years: dsl.years || "",
    verified: !!dsl.verified,
    source: dsl.source || "",
    field: dsl.field,
    columns: dsl.field.columns,
    audienceLabel: dsl.field.audienceLabel || "AUDIENCE",
    autoSeconds: dsl.autoSeconds || null,
    alliances: dsl.alliances,
    geometry: dsl.geometry,
    tags: dsl.tags || [],
    offFieldTags: dsl.offFieldTags || [],
    obstacles,
    launchLines: dsl.launchLines || [],
    actions: dsl.actions,
    codeNotes: dsl.codeNotes || [],
    mirror: { point: mirrorPoint, heading: mirrorHeading, tag: mirrorTag, at: dsl.mirror.at, axis: dsl.mirror.axis },
    getPresets,
    validateStart,
    renderEmit,
    actionDuration,
  };
}

/* ------------------------------------------------- stop-at-waypoint model - */
/* Every move is: accelerate, cruise, decelerate, settle. No blending between
 * waypoints. Mecanum can translate and rotate at once, so a leg costs
 * max(translate, rotate) rather than their sum. */

const DEFAULT_MOTION = {
  maxVelocity: 40,      // in/s
  maxAccel: 60,         // in/s^2
  turnRate: 180,        // deg/s
  posTolerance: 1.0,    // in
  headingTolerance: 2,  // deg
  settleTime: 0.15,     // s
  runawayMargin: 4.0,   // in — abort if the error grows this far past its start
  timeoutBase: 1.5,     // s of slack per leg
  timeoutFactor: 2.5,   // multiple of the estimated leg time
  timeoutCeiling: 8.0,  // s hard cap
  transP: 0.060, transI: 0.000, transD: 0.006,
  headP: 0.020, headI: 0.000, headD: 0.002,
  minPower: 0.08, maxPower: 0.80,
};

const trapezoidTime = (d, vMax, aMax) => {
  if (d <= 0) return 0;
  if (!vMax || !aMax) return 0;
  const dAccel = (vMax * vMax) / aMax;   // distance to reach vMax and come back down
  if (d < dAccel) return 2 * Math.sqrt(d / aMax);
  return d / vMax + vMax / aMax;
};

const headingDelta = (from, to) => {
  let d = Math.abs(((to - from) % 360 + 540) % 360 - 180);
  return d;
};

const legTime = (from, to, motion) => {
  const d = Math.hypot(to.x - from.x, to.y - from.y);
  const drive = trapezoidTime(d, motion.maxVelocity, motion.maxAccel);
  const turn = headingDelta(from.heading, to.heading) / (motion.turnRate || 1);
  return Math.max(drive, turn) + motion.settleTime;
};

const estimatePath = (startPose, waypoints, motion, season) => {
  const legs = [];
  let prev = startPose;
  let total = 0;
  waypoints.forEach((wp) => {
    const move = legTime(prev, wp, motion);
    const act = season.actionDuration(wp.action, wp.actionParams || {});
    legs.push({ id: wp.id, move, action: act, cumulative: total + move + act });
    total += move + act;
    prev = wp;
  });
  return { legs, total };
};

/* ============================================================================
 * Self-contained OpMode generator.
 *
 * Everything the autonomous needs lives inside one class: odometry, motion,
 * vision, mechanism macros, and the path. No helper classes, because two
 * OpMode files in the same package cannot each define `class Localizer` —
 * duplicate class, compile error. Private methods inside the OpMode collide
 * with nothing, so every generated auto is independent.
 *
 * The trade: a change to a shared value means regenerating every auto. That is
 * a button press rather than a forgotten file, which is the failure mode that
 * actually bites at a competition.
 * ==========================================================================*/

const DEFAULT_ODOMETRY = {
  parallel: { hardwareName: "frontRight", reversed: true, ticksPerInch: 505.2, xOffsetIn: 0 },
  perpendicular: { hardwareName: "frontLeft", reversed: true, ticksPerInch: 505.2, yOffsetIn: 0 },
  calibration: { status: "uncalibrated" },
};

const DEFAULT_DRIVE_NAMES = { frontLeft: "frontLeft", frontRight: "frontRight", backLeft: "backLeft", backRight: "backRight" };

const javaClassName = (s) => {
  const parts = String(s || "").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/);
  if (!parts.length || !parts[0]) return "PathPilotAuto";
  return parts.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
};

function generateOpMode({ className, season, alliance, startPose, waypoints, motion, profile, timing }) {
  const A = season.alliances[alliance];
  const myTag = A.tag;
  const ctx = { myTag, alliance, season };

  const odo = (profile && profile.odometry) || DEFAULT_ODOMETRY;
  const noOdometry = !!(profile && profile.odometry && profile.odometry.type === "none");
  const par = odo.parallel || DEFAULT_ODOMETRY.parallel;
  const per = odo.perpendicular || DEFAULT_ODOMETRY.perpendicular;
  const calibrated = odo.calibration && odo.calibration.status === "calibrated";

  const driveMotors = (profile && profile.drive && profile.drive.motors) || null;
  const driveNames = driveMotors
    ? Object.keys(driveMotors).reduce((acc, k) => { acc[k] = driveMotors[k].hardwareName || k; return acc; }, {})
    : DEFAULT_DRIVE_NAMES;
  const fl = driveNames.frontLeft || "frontLeft";
  const fr = driveNames.frontRight || "frontRight";
  const bl = driveNames.backLeft || "backLeft";
  const br = driveNames.backRight || "backRight";

  // Motor directions come from the profile, not from an assumption about which
  // side is which. Default to the usual mecanum arrangement only when unknown.
  const dirOf = (role, fallback) => {
    if (driveMotors && driveMotors[role] && driveMotors[role].reversed !== undefined) {
      return !!driveMotors[role].reversed;
    }
    return fallback;
  };
  const revFL = dirOf("frontLeft", true);
  const revFR = dirOf("frontRight", false);
  const revBL = dirOf("backLeft", true);
  const revBR = dirOf("backRight", false);

  /* setDirection(REVERSE) also negates getCurrentPosition(). A pod plugged into
   * a reversed motor's encoder port therefore reads with the opposite sign here
   * than it did in the calibration OpMode, which sets no directions at all.
   *
   * Measured on GoBilda1: bare encoder read -7634 for a nose-first push, so the
   * pod's own reversal is true; with backLeft set REVERSE the same push read
   * +7634, and the pose ran backwards. XOR resolves the two frames.
   */
  const hostReversedFor = (pod) => {
    if (!driveMotors || !pod || !pod.hardwareName) return false;
    const entry = Object.values(driveMotors).find(m => m.hardwareName === pod.hardwareName);
    return entry ? !!entry.reversed : false;
  };
  const parHostRev = hostReversedFor(par);
  const perHostRev = hostReversedFor(per);
  const parEffectiveRev = !!par.reversed !== parHostRev;   // XOR
  const perEffectiveRev = !!per.reversed !== perHostRev;

  const hasLimelight = !!(profile && profile.limelight && profile.limelight.present) || season.tags.length > 0;
  const pipeline = (profile && profile.limelight && profile.limelight.pipeline) || 0;

  // Only the macros this path actually calls get emitted.
  const usedMethods = new Set(
    waypoints.filter(w => w.action === "macro" && w.actionParams && w.actionParams.macroMethod)
             .map(w => w.actionParams.macroMethod));
  const allMacros = (profile && profile.macros) || [];
  const macros = allMacros.filter(m => usedMethods.has(m.method) && m.java);

  const macroMotors = new Set();
  const macroServos = new Set();
  const macroPatterns = new Map();
  let macroBlinkin = false;
  macros.forEach(m => {
    (m.java.motors || []).forEach(x => macroMotors.add(x));
    (m.java.servos || []).forEach(x => macroServos.add(x));
    if (m.java.usesBlinkin) macroBlinkin = true;
    (m.java.patterns || []).forEach(p => macroPatterns.set(p.constant, p.value));
  });

  const usesVision = waypoints.some(w => ["faceTag", "driveToTag", "readMotif"].includes(w.action));
  const needLimelight = hasLimelight && usesVision;

  const L = [];
  const P = (...lines) => lines.forEach(l => L.push(l));

  if (noOdometry) {
    return [
      "// " + className + " cannot be generated.",
      "//",
      "// The loaded robot profile reports no odometry (odometry.type = \"none\").",
      "// Every waypoint in this path is a field coordinate, and driveTo closes the",
      "// loop on the robot's measured position — without pods there is nothing to",
      "// measure, so the generated code would drive blind.",
      "//",
      "// Either fit odometry and configure it in BotBuilder, or drive this routine",
      "// from TeleOp macros instead of a PathPilot path.",
    ].join("\n");
  }

  /* ---------------- header ---------------- */
  P("package org.firstinspires.ftc.teamcode;",
    "",
    "import com.qualcomm.hardware.rev.RevHubOrientationOnRobot;");
  if (needLimelight) {
    P("import com.qualcomm.hardware.limelightvision.LLResult;",
      "import com.qualcomm.hardware.limelightvision.LLResultTypes;",
      "import com.qualcomm.hardware.limelightvision.Limelight3A;");
  }
  P("import com.qualcomm.robotcore.eventloop.opmode.Autonomous;",
    "import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;",
    "import com.qualcomm.robotcore.hardware.DcMotor;",
    "import com.qualcomm.robotcore.hardware.DcMotorEx;",
    "import com.qualcomm.robotcore.hardware.DcMotorSimple;",
    "import com.qualcomm.robotcore.hardware.IMU;");
  if (macroServos.size || macroBlinkin) P("import com.qualcomm.robotcore.hardware.Servo;");
  P("import com.qualcomm.robotcore.util.ElapsedTime;",
    "",
    "import org.firstinspires.ftc.robotcore.external.navigation.AngleUnit;");
  if (needLimelight) {
    P("import org.firstinspires.ftc.robotcore.external.navigation.Pose3D;",
      "import org.firstinspires.ftc.robotcore.external.navigation.Position;");
  }
  if (needLimelight) P("", "import java.util.List;");
  P("");

  /* ---------------- doc comment ---------------- */
  P("/**",
    ` * ${className} — generated by PathPilot.`,
    " *",
    ` * Game: ${season.name} ${season.years}`,
    ` * Alliance: ${alliance.toUpperCase()}`,
    ` * Estimated runtime: ${timing.total.toFixed(1)}s${season.autoSeconds ? ` of ${season.autoSeconds}s AUTO` : ""}`,
    " *",
    " * FIELD COORDINATES (audience view)",
    " *   (0,0) is the bottom-left corner. +X right, +Y away from the audience.",
    " *   heading 0 faces +Y and increases CLOCKWISE (90 faces +X).",
    " *",
    " * MOTION MODEL: stop-at-waypoint",
    " *   Each leg accelerates, cruises, decelerates, then settles inside",
    " *   tolerance before the next begins. No blending between waypoints.",
    " *",
    " * This file is self-contained — nothing else needs to be on the Hub.",
    " * Regenerate it from PathPilot rather than hand-editing; a tuning change",
    " * here will be lost, and will not reach your other autos.");
  if (!calibrated) {
    P(" *",
      " * WARNING: odometry is not calibrated. The ticks-per-inch and pod offsets",
      " * below are theoretical. Run OdometryCalibration and update them, or every",
      " * position in this path is approximate.");
  }
  P(" */",
    `@Autonomous(name = "${className}", group = "PathPilot")`,
    `public class ${className} extends LinearOpMode {`,
    "");

  /* ---------------- constants ---------------- */
  P("    // ================= tuning (PathPilot Motion tab) =================",
    `    public static final double MAX_VELOCITY = ${motion.maxVelocity};        // in/s`,
    `    public static final double MAX_ACCEL = ${motion.maxAccel};            // in/s^2`,
    `    public static final double TURN_RATE = ${motion.turnRate};            // deg/s`,
    `    public static final double POS_TOLERANCE = ${motion.posTolerance};        // in`,
    `    public static final double HEADING_TOLERANCE = ${motion.headingTolerance};    // deg`,
    `    public static final double SETTLE_TIME = ${motion.settleTime};         // s inside tolerance`,
    `    public static final double TIMEOUT_BASE = ${motion.timeoutBase};        // s slack per leg`,
    `    public static final double TIMEOUT_FACTOR = ${motion.timeoutFactor};      // multiple of the estimate`,
    `    public static final double TIMEOUT_CEILING = ${motion.timeoutCeiling};     // s hard cap`,
    "    /* If the error grows well past where it started, the pose is lying —",
    "     * usually an inverted pod. Stopping after a couple of inches of divergence",
    "     * beats driving at full power until the timeout expires. */",
    `    public static final double RUNAWAY_MARGIN = ${motion.runawayMargin};      // in`,
    `    public static final double MIN_POWER = ${motion.minPower};           // beats static friction`,
    `    public static final double MAX_POWER = ${motion.maxPower};`,
    "",
    `    public static final double TRANS_KP = ${motion.transP};`,
    `    public static final double TRANS_KI = ${motion.transI};`,
    `    public static final double TRANS_KD = ${motion.transD};`,
    `    public static final double HEAD_KP = ${motion.headP};`,
    `    public static final double HEAD_KI = ${motion.headI};`,
    `    public static final double HEAD_KD = ${motion.headD};`,
    "    public static final double I_LIMIT = 5.0;",
    "");

  P("    // ================= odometry =================",
    `    // ${calibrated ? "Calibrated " + (odo.calibration.date || "") : "THEORETICAL — run OdometryCalibration and replace these"}`,
    `    public static final double PARALLEL_TICKS_PER_INCH = ${par.ticksPerInch || 505.2};`,
    `    public static final double PERPENDICULAR_TICKS_PER_INCH = ${per.ticksPerInch || 505.2};`,
    "    /** Parallel pod's lateral offset from centre, + right. */",
    `    public static final double PARALLEL_X_OFFSET = ${par.xOffsetIn || 0};`,
    "    /** Perpendicular pod's forward offset from centre, + forward. */",
    `    public static final double PERPENDICULAR_Y_OFFSET = ${per.yOffsetIn || 0};`,
    `    // Pod reversal ${!!par.reversed} XOR host motor "${par.hardwareName}" direction`,
    `    // ${parHostRev ? "REVERSE" : "FORWARD"} = ${parEffectiveRev}. setDirection also negates the encoder,`,
    "    // so this differs from the value stored in BotBuilder. That is deliberate.",
    `    public static final boolean PARALLEL_REVERSED = ${parEffectiveRev};`,
    `    // Pod reversal ${!!per.reversed} XOR host motor "${per.hardwareName}" direction`,
    `    // ${perHostRev ? "REVERSE" : "FORWARD"} = ${perEffectiveRev}.`,
    `    public static final boolean PERPENDICULAR_REVERSED = ${perEffectiveRev};`,
    "");

  if (macroServos.size || macroBlinkin) {
    P("    // ================= mechanisms =================",
      "    public static final double SERVO_SETTLE = 0.30;");
    macroPatterns.forEach((v, k) => P(`    public static final double ${k} = ${v};`));
    P("");
  }

  P("    // ================= starting pose =================",
    "    // Place the robot here before the match.",
    `    public static final double START_X = ${startPose.x.toFixed(1)};`,
    `    public static final double START_Y = ${startPose.y.toFixed(1)};`,
    `    public static final double START_HEADING = ${startPose.heading};`,
    "");
  if (myTag) P(`    public static final int GOAL_TAG = ${myTag};`, "");

  /* ---------------- fields ---------------- */
  P("    private DcMotor frontLeft, frontRight, backLeft, backRight;",
    "    private DcMotorEx parallelPod, perpendicularPod;",
    "    private IMU imu;");
  if (needLimelight) P("    private Limelight3A limelight;");
  Array.from(macroMotors).forEach(m => P(`    private DcMotorEx ${m};`));
  Array.from(macroServos).forEach(m => P(`    private Servo ${m};`));
  if (macroBlinkin) P("    private Servo blinkin;");
  P("",
    "    private double poseX, poseY, poseHeading;",
    "    private int lastParallelTicks, lastPerpendicularTicks;",
    "    private double lastHeading, seedYaw, seedHeading;",
    "",
    "    private final ElapsedTime legTimer = new ElapsedTime();",
    "    private final ElapsedTime settleTimer = new ElapsedTime();",
    "    private final ElapsedTime macroTimer = new ElapsedTime();",
    "    private int legIndex = 0;",
    "    private boolean aborted = false;",
    "");

  /* ---------------- runOpMode ---------------- */
  P("    @Override",
    "    public void runOpMode() {",
    "        initHardware();",
    "        setPose(START_X, START_Y, START_HEADING);",
    "",
    '        telemetry.addLine("PathPilot ready");',
    '        telemetry.addData("start", "%.1f, %.1f @ %.0f", START_X, START_Y, START_HEADING);');
  if (!calibrated) P('        telemetry.addLine("odometry NOT calibrated - positions approximate");');
  P("        telemetry.update();",
    "",
    "        waitForStart();",
    "        if (isStopRequested()) return;",
    "");
  if (needLimelight) P("        if (limelight != null) limelight.start();", "");

  /* ---------------- the path ---------------- */
  P("        // ================= path =================");
  // Once a leg fails the pose is no longer trustworthy, and every later
  // waypoint is measured from a position the robot is not at. Continuing is
  // worse than stopping, so each leg gates the rest of the path.
  waypoints.forEach((wp, i) => {
    const leg = timing.legs[i];
    P(`        // Waypoint ${i + 1} — (${wp.x.toFixed(1)}, ${wp.y.toFixed(1)}) @ ${wp.heading}deg  [~${leg.move.toFixed(1)}s]`);
    P(`        if (!driveTo(${wp.x.toFixed(1)}, ${wp.y.toFixed(1)}, ${wp.heading})) { finish(); return; }`);
    season.renderEmit(wp.action, wp.actionParams || {}, ctx).forEach(line => P(`        ${line}`));
    P("");
  });

  P("        finish();",
    "    }",
    "");

  P("    /** Stops everything and reports. Called on completion or on a failed leg. */",
    "    private void finish() {",
    "        stopDrive();");
  if (needLimelight) P("        if (limelight != null) limelight.stop();");
  P('        telemetry.addLine(aborted ? "PATH ABORTED - see the reason above" : "Path complete");',
    '        telemetry.addData("final pose", "%.1f, %.1f @ %.0f", poseX, poseY, poseHeading);',
    '        telemetry.addData("legs completed", legIndex + (aborted ? " (last one failed)" : ""));',
    "        telemetry.update();",
    "    }",
    "");

  /* ---------------- init ---------------- */
  P("    // ================= hardware =================",
    "    private void initHardware() {",
    `        frontLeft = hardwareMap.get(DcMotor.class, "${fl}");`,
    `        frontRight = hardwareMap.get(DcMotor.class, "${fr}");`,
    `        backLeft = hardwareMap.get(DcMotor.class, "${bl}");`,
    `        backRight = hardwareMap.get(DcMotor.class, "${br}");`,
    "",
    `        frontLeft.setDirection(DcMotorSimple.Direction.${revFL ? "REVERSE" : "FORWARD"});`,
    `        backLeft.setDirection(DcMotorSimple.Direction.${revBL ? "REVERSE" : "FORWARD"});`,
    `        frontRight.setDirection(DcMotorSimple.Direction.${revFR ? "REVERSE" : "FORWARD"});`,
    `        backRight.setDirection(DcMotorSimple.Direction.${revBR ? "REVERSE" : "FORWARD"});`,
    "",
    "        frontLeft.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);",
    "        frontRight.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);",
    "        backLeft.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);",
    "        backRight.setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);",
    "",
    "        // The pods occupy these motors' encoder ports, so the drive motors",
    "        // must stay in RUN_WITHOUT_ENCODER — their encoders read the pod.",
    "        frontLeft.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);",
    "        frontRight.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);",
    "        backLeft.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);",
    "        backRight.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);",
    "",
    `        parallelPod = hardwareMap.get(DcMotorEx.class, "${par.hardwareName || "frontRight"}");`,
    `        perpendicularPod = hardwareMap.get(DcMotorEx.class, "${per.hardwareName || "frontLeft"}");`,
    "",
    '        imu = hardwareMap.get(IMU.class, "imu");',
    "        imu.initialize(new IMU.Parameters(new RevHubOrientationOnRobot(",
    `                RevHubOrientationOnRobot.LogoFacingDirection.${(profile && profile.imu && profile.imu.logoDirection) || "UP"},`,
    `                RevHubOrientationOnRobot.UsbFacingDirection.${(profile && profile.imu && profile.imu.usbDirection) || "FORWARD"})));`,
    "        imu.resetYaw();",
    "");
  Array.from(macroMotors).forEach(m => {
    P(`        ${m} = hardwareMap.get(DcMotorEx.class, "${m}");`);
    P(`        ${m}.setMode(DcMotor.RunMode.RUN_USING_ENCODER);`);
  });
  Array.from(macroServos).forEach(m => P(`        ${m} = hardwareMap.get(Servo.class, "${m}");`));
  if (macroBlinkin) P('        blinkin = hardwareMap.get(Servo.class, "blinkin");');
  if (needLimelight) {
    P("",
      '        limelight = hardwareMap.get(Limelight3A.class, "limelight");',
      `        if (limelight != null) limelight.pipelineSwitch(${pipeline});`);
  }
  P("    }", "");

  /* ---------------- odometry ---------------- */
  P("    // ================= odometry =================",
    "    /** Declares where the robot is. Also used after an AprilTag fix. */",
    "    private void setPose(double x, double y, double headingDeg) {",
    "        poseX = x;",
    "        poseY = y;",
    "        poseHeading = normalize(headingDeg);",
    "        seedHeading = poseHeading;",
    "        seedYaw = rawYaw();",
    "        lastParallelTicks = readParallel();",
    "        lastPerpendicularTicks = readPerpendicular();",
    "        lastHeading = poseHeading;",
    "    }",
    "",
    "    /**",
    "     * Integrates one step of two-pod plus IMU odometry.",
    "     *",
    "     * A pod that is not at the centre of rotation registers ticks when the",
    "     * robot spins in place even though it has not translated. The offset terms",
    "     * cancel that. Leave them at zero and every turn injects error.",
    "     */",
    "    private void updatePose() {",
    "        // IMU yaw is counter-clockwise positive; heading is clockwise positive.",
    "        double fieldHeading = normalize(seedHeading - (rawYaw() - seedYaw));",
    "",
    "        int parallelTicks = readParallel();",
    "        int perpendicularTicks = readPerpendicular();",
    "        double parallelInches = (parallelTicks - lastParallelTicks) / PARALLEL_TICKS_PER_INCH;",
    "        double perpendicularInches = (perpendicularTicks - lastPerpendicularTicks) / PERPENDICULAR_TICKS_PER_INCH;",
    "        lastParallelTicks = parallelTicks;",
    "        lastPerpendicularTicks = perpendicularTicks;",
    "",
    "        double deltaHeadingDeg = wrap(fieldHeading - lastHeading);",
    "        double deltaHeadingRad = Math.toRadians(deltaHeadingDeg);",
    "        lastHeading = fieldHeading;",
    "",
    "        double deltaForward = parallelInches + deltaHeadingRad * PARALLEL_X_OFFSET;",
    "        double deltaLeft = perpendicularInches + deltaHeadingRad * PERPENDICULAR_Y_OFFSET;",
    "",
    "        // Integrate about the midpoint heading of the step.",
    "        double mid = Math.toRadians(fieldHeading - deltaHeadingDeg / 2.0);",
    "        double sin = Math.sin(mid), cos = Math.cos(mid);",
    "        // forward maps to (sin, cos); left maps to (-cos, sin)",
    "        poseX += deltaForward * sin - deltaLeft * cos;",
    "        poseY += deltaForward * cos + deltaLeft * sin;",
    "        poseHeading = fieldHeading;",
    "    }",
    "",
    "    private double rawYaw() {",
    "        return imu.getRobotYawPitchRollAngles().getYaw(AngleUnit.DEGREES);",
    "    }",
    "",
    "    private int readParallel() {",
    "        int t = parallelPod.getCurrentPosition();",
    "        return PARALLEL_REVERSED ? -t : t;",
    "    }",
    "",
    "    private int readPerpendicular() {",
    "        int t = perpendicularPod.getCurrentPosition();",
    "        return PERPENDICULAR_REVERSED ? -t : t;",
    "    }",
    "",
    "    /** Folds an angle into [0, 360). */",
    "    private static double normalize(double deg) {",
    "        double d = deg % 360.0;",
    "        if (d < 0) d += 360.0;",
    "        return d;",
    "    }",
    "",
    "    /** Folds an angle into (-180, 180]. */",
    "    private static double wrap(double deg) {",
    "        double d = (deg + 180.0) % 360.0;",
    "        if (d <= 0) d += 360.0;",
    "        return d - 180.0;",
    "    }",
    "");

  /* ---------------- motion ---------------- */
  P("    // ================= motion =================",
    "    /** Drives to a field pose and settles. False if the leg timed out. */",
    "    private boolean driveTo(double targetX, double targetY, double targetHeadingDeg) {",
    "        legIndex++;",
    "        legTimer.reset();",
    "        settleTimer.reset();",
    "",
    "        double lastPosError = Math.hypot(targetX - poseX, targetY - poseY);",
    "        double lastHeadError = wrap(targetHeadingDeg - poseHeading);",
    "        final double startPosError = lastPosError;",
    "        boolean madeProgress = false;",
    "        double timeout = legTimeout(lastPosError, lastHeadError);",
    "        double posIntegral = 0, headIntegral = 0;",
    "        double lastTime = legTimer.seconds();",
    "        boolean inTolerance = false;",
    "",
    "        while (opModeIsActive()) {",
    "            updatePose();",
    "",
    "            double now = legTimer.seconds();",
    "            double dt = now - lastTime;",
    "            if (dt <= 0) dt = 1e-3;",
    "            lastTime = now;",
    "",
    "            double dx = targetX - poseX;",
    "            double dy = targetY - poseY;",
    "            double posError = Math.hypot(dx, dy);",
    "            double headError = wrap(targetHeadingDeg - poseHeading);",
    "",
    "            boolean posOk = posError <= POS_TOLERANCE;",
    "            boolean headOk = Math.abs(headError) <= HEADING_TOLERANCE;",
    "",
    "            if (posOk && headOk) {",
    "                if (!inTolerance) { inTolerance = true; settleTimer.reset(); }",
    "                if (settleTimer.seconds() >= SETTLE_TIME) { stopDrive(); return true; }",
    "            } else {",
    "                inTolerance = false;",
    "            }",
    "",
    "            if (posError < startPosError - 1.0) madeProgress = true;",
    "",
    "            // Only a leg that never got closer at all is a runaway. Overshooting",
    "            // or oscillating means the pose is real and the gains need work.",
    "            if (!madeProgress && posError > startPosError + RUNAWAY_MARGIN) {",
    "                stopDrive();",
    "                aborted = true;",
    '                telemetry.addLine("RUNAWAY on leg " + legIndex);',
    '                telemetry.addData("error grew", "%.1f in -> %.1f in", startPosError, posError);',
    '                telemetry.addLine("The pose is moving away from the target.");',
    '                telemetry.addLine("Usually an odometry pod reading the wrong sign.");',
    "                telemetry.update();",
    "                return false;",
    "            }",
    "",
    "            if (now > timeout) {",
    "                stopDrive();",
    "                aborted = true;",
    '                telemetry.addData("TIMEOUT leg " + legIndex, "%.1f in / %.1f deg left", posError, headError);',
    "                telemetry.update();",
    "                return false;",
    "            }",
    "",
    "            posIntegral = clamp(posIntegral + posError * dt, -I_LIMIT, I_LIMIT);",
    "            headIntegral = clamp(headIntegral + headError * dt, -I_LIMIT, I_LIMIT);",
    "            double posDeriv = (posError - lastPosError) / dt;",
    "            double headDeriv = (headError - lastHeadError) / dt;",
    "            lastPosError = posError;",
    "            lastHeadError = headError;",
    "",
    "            double drivePower = clamp(TRANS_KP * posError + TRANS_KI * posIntegral + TRANS_KD * posDeriv,",
    "                                      -MAX_POWER, MAX_POWER);",
    "            if (!posOk && Math.abs(drivePower) < MIN_POWER) drivePower = Math.copySign(MIN_POWER, drivePower);",
    "            if (posOk) drivePower = 0;",
    "",
    "            double turnPower = clamp(HEAD_KP * headError + HEAD_KI * headIntegral + HEAD_KD * headDeriv,",
    "                                     -MAX_POWER, MAX_POWER);",
    "            if (!headOk && Math.abs(turnPower) < MIN_POWER) turnPower = Math.copySign(MIN_POWER, turnPower);",
    "            if (headOk) turnPower = 0;",
    "",
    "            // Field error into robot frame.",
    "            double h = Math.toRadians(poseHeading);",
    "            double sin = Math.sin(h), cos = Math.cos(h);",
    "            double unitX = posError > 1e-6 ? dx / posError : 0;",
    "            double unitY = posError > 1e-6 ? dy / posError : 0;",
    "            double forward = unitX * sin + unitY * cos;",
    "            double left = -unitX * cos + unitY * sin;",
    "",
    "            setMecanum(forward * drivePower, left * drivePower, turnPower);",
    "",
    '            telemetry.addData("leg", legIndex);',
    '            telemetry.addData("pose", "%.1f, %.1f @ %.0f", poseX, poseY, poseHeading);',
    '            telemetry.addData("error", "%.2f in, %.1f deg", posError, headError);',
    "            telemetry.update();",
    "        }",
    "",
    "        stopDrive();",
    "        return false;",
    "    }",
    "",
    "    private boolean turnTo(double targetHeadingDeg) {",
    "        return driveTo(poseX, poseY, targetHeadingDeg);",
    "    }",
    "",
    "    /**",
    "     * A flat per-move timeout cannot work — a 6-inch hop and a 96-inch run",
    "     * need very different budgets. This uses the same trapezoidal estimate",
    "     * PathPilot shows, times a slack factor.",
    "     */",
    "    private double legTimeout(double distanceIn, double turnDeg) {",
    "        double drive = trapezoidSeconds(distanceIn, MAX_VELOCITY, MAX_ACCEL);",
    "        double turn = Math.abs(turnDeg) / TURN_RATE;",
    "        return Math.min(TIMEOUT_BASE + TIMEOUT_FACTOR * Math.max(drive, turn), TIMEOUT_CEILING);",
    "    }",
    "",
    "    private static double trapezoidSeconds(double distance, double vMax, double aMax) {",
    "        if (distance <= 0 || vMax <= 0 || aMax <= 0) return 0;",
    "        double ramp = (vMax * vMax) / aMax;",
    "        if (distance < ramp) return 2 * Math.sqrt(distance / aMax);",
    "        return distance / vMax + vMax / aMax;",
    "    }",
    "",
    "    /** forward/left/turn in [-1,1], robot frame; turn positive clockwise. */",
    "    private void setMecanum(double forward, double left, double turn) {",
    "        double strafe = -left;",
    "        double a = forward + strafe + turn;",
    "        double b = forward - strafe - turn;",
    "        double c = forward - strafe + turn;",
    "        double d = forward + strafe - turn;",
    "        double max = Math.max(Math.max(Math.abs(a), Math.abs(b)), Math.max(Math.abs(c), Math.abs(d)));",
    "        if (max > 1.0) { a /= max; b /= max; c /= max; d /= max; }",
    "        frontLeft.setPower(a);",
    "        frontRight.setPower(b);",
    "        backLeft.setPower(c);",
    "        backRight.setPower(d);",
    "    }",
    "",
    "    private void stopDrive() {",
    "        frontLeft.setPower(0);",
    "        frontRight.setPower(0);",
    "        backLeft.setPower(0);",
    "        backRight.setPower(0);",
    "    }",
    "",
    "    private static double clamp(double v, double lo, double hi) {",
    "        return v < lo ? lo : (v > hi ? hi : v);",
    "    }",
    "");

  /* ---------------- vision ---------------- */
  if (needLimelight) {
    P("    // ================= vision =================",
      "    /** Camera-space position of a tag, or null when not visible. */",
      "    private Position seeTag(int tagId) {",
      "        if (limelight == null) return null;",
      "        LLResult result = limelight.getLatestResult();",
      "        if (result == null || !result.isValid()) return null;",
      "        List<LLResultTypes.FiducialResult> detections = result.getFiducialResults();",
      "        if (detections == null) return null;",
      "        for (LLResultTypes.FiducialResult d : detections) {",
      "            if (d.getFiducialId() == tagId) {",
      "                Pose3D pose = d.getTargetPoseCameraSpace();",
      "                return pose == null ? null : pose.getPosition();",
      "            }",
      "        }",
      "        return null;",
      "    }",
      "",
      "    private boolean faceAprilTag(int tagId) {",
      "        legTimer.reset();",
      "        while (opModeIsActive() && legTimer.seconds() < 3.0) {",
      "            updatePose();",
      "            Position p = seeTag(tagId);",
      "            if (p == null) { stopDrive(); continue; }",
      "            double angleErr = Math.toDegrees(Math.atan2(p.x * 39.37, p.z * 39.37));",
      "            if (Math.abs(angleErr) <= HEADING_TOLERANCE) { stopDrive(); return true; }",
      "            double turn = clamp(HEAD_KP * angleErr, -MAX_POWER, MAX_POWER);",
      "            if (Math.abs(turn) < MIN_POWER) turn = Math.copySign(MIN_POWER, turn);",
      "            setMecanum(0, 0, turn);",
      "        }",
      "        stopDrive();",
      "        return false;",
      "    }",
      "",
      "    private boolean driveToAprilTag(int tagId, double targetDistanceIn) {",
      "        legTimer.reset();",
      "        while (opModeIsActive() && legTimer.seconds() < 3.0) {",
      "            updatePose();",
      "            Position p = seeTag(tagId);",
      "            if (p == null) { stopDrive(); continue; }",
      "            double xIn = p.x * 39.37, zIn = p.z * 39.37;",
      "            double rangeErr = zIn - targetDistanceIn;",
      "            double angleErr = Math.toDegrees(Math.atan2(xIn, zIn));",
      "            if (Math.abs(rangeErr) <= POS_TOLERANCE && Math.abs(angleErr) <= HEADING_TOLERANCE) {",
      "                stopDrive();",
      "                return true;",
      "            }",
      "            double forward = clamp(TRANS_KP * rangeErr, -MAX_POWER, MAX_POWER);",
      "            if (Math.abs(rangeErr) > POS_TOLERANCE && Math.abs(forward) < MIN_POWER) {",
      "                forward = Math.copySign(MIN_POWER, forward);",
      "            }",
      "            setMecanum(forward, 0, clamp(HEAD_KP * angleErr, -MAX_POWER, MAX_POWER));",
      "        }",
      "        stopDrive();",
      "        return false;",
      "    }",
      "",
      "    /** Reads the obelisk MOTIF tag. Returns -1 when none is visible. */",
      "    private int readObeliskMotif() {",
      "        for (int id = 21; id <= 23; id++) {",
      "            if (seeTag(id) != null) return id;",
      "        }",
      "        return -1;",
      "    }",
      "");
  }

  /* ---------------- macros ---------------- */
  if (macros.length) {
    P("    // ================= mechanism macros =================",
      "    // Generated by BotBuilder from macros flagged \"Available in PathPilot\".",
      "    // Edit them in BotBuilder and regenerate — changes here will be lost.",
      "");
    macros.forEach(m => {
      const empty = !m.java.body || m.java.body.length === 0;
      P(`    /** ${m.name} — ${m.stepCount} step(s), ~${m.java.estSeconds}s */`,
        `    private void ${m.method}() {`);
      if (empty) {
        // An empty macro is legal, but silence at the robot is the worst way to
        // learn about it. Say so on the Driver Station instead.
        P(`        // "${m.name}" has no steps in BotBuilder, so there is nothing to run.`,
          `        telemetry.addLine("${m.method}(): macro is empty - nothing happened");`,
          "        telemetry.update();");
      } else {
        m.java.body.forEach(line => P(line ? `        ${line}` : ""));
      }
      P("    }", "");
    });
  } else if (usedMethods.size) {
    P("    // ================= mechanism macros =================",
      "    // This path calls macros that are not in the loaded robot profile:",
      `    //   ${Array.from(usedMethods).join(", ")}`,
      "    // Load the profile from BotBuilder and regenerate, or the build will fail.",
      "");
  }

  P("}");
  return L.join("\n");
}

/* -------------------------------------------------------------- component */

const MARGIN = 42;
let idCounter = 1000;
const nextId = () => ++idCounter;

const IN = { width: "100%", fontSize: "12px", background: "#18181b", border: "1px solid #3f3f46", borderRadius: "4px", padding: "5px 8px", color: "#fafafa" };
const LB = { fontSize: "11px", color: "#a1a1aa", display: "block", marginBottom: "3px" };
const CARD = { background: "#27272a", borderRadius: "8px", padding: "12px", border: "1px solid #3f3f46" };
const BTN = { background: "transparent", border: "1px solid #52525b", color: "#fafafa", padding: "5px 10px", borderRadius: "6px", cursor: "pointer", fontSize: "12px" };

function NumField({ label, value, onChange, step = 1, min, max, suffix }) {
  return (
    <div>
      <label style={LB}>{label}</label>
      <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
        <input type="number" value={value} step={step} min={min} max={max} style={IN}
               onChange={(e) => onChange(Number(e.target.value))} />
        {suffix && <span style={{ fontSize: "10px", color: "#71717a", minWidth: "30px" }}>{suffix}</span>}
      </div>
    </div>
  );
}

function PathPilot() {
  const [packs, setPacks] = useState(() => BUILTIN_PACKS.map(p => compileSeason(p)));
  const [seasonId, setSeasonId] = useState(BUILTIN_PACKS[0].id);
  const [pendingSeason, setPendingSeason] = useState(null);
  const season = packs.find(p => p.id === seasonId) || packs[0];

  const FIELD = season.field.size;
  const TILE = season.field.tile;
  const SCALE = 490 / FIELD;
  const VIEW = FIELD * SCALE + MARGIN * 2;

  const [alliance, setAlliance] = useState("blue");
  const [robotSize, setRobotSize] = useState(18);
  const [motion, setMotion] = useState(DEFAULT_MOTION);
  const [startPose, setStartPose] = useState(() => {
    const p = compileSeason(BUILTIN_PACKS[0]).getPresets("blue", 18)[0];
    return { x: p.x, y: p.y, heading: p.heading };
  });
  const [startPreset, setStartPreset] = useState(() => compileSeason(BUILTIN_PACKS[0]).getPresets("blue", 18)[0].id);
  const [waypoints, setWaypoints] = useState([]);
  const [selection, setSelection] = useState({ type: "start" });
  const [drag, setDrag] = useState(null);
  const [insertAfter, setInsertAfter] = useState(null);
  const [showGrid, setShowGrid] = useState(true);
  const [showZones, setShowZones] = useState(true);
  const [showArtifacts, setShowArtifacts] = useState(true);
  const [dimOpponent, setDimOpponent] = useState(true);
  const [tab, setTab] = useState("path");
  const [notice, setNotice] = useState(null);
  // Transient confirmations shouldn't linger; problems should.
  useEffect(() => {
    if (!notice || notice.bad) return;
    const t = setTimeout(() => setNotice(null), 4000);
    return () => clearTimeout(t);
  }, [notice]);
  const [pathName, setPathName] = useState("Auto");
  const [profile, setProfile] = useState(null);
  const macros = profile && profile.macros ? profile.macros : [];
  // A season contributes tag actions; a robot without a camera cannot run them.
  const profileHasLimelight = !profile || !profile.limelight || profile.limelight.present !== false;
  const visibleActions = profileHasLimelight
    ? season.actions
    : season.actions.filter(a => !["faceTag", "driveToTag", "readMotif"].includes(a.id));
  const svgRef = useRef(null);

  const opponent = alliance === "blue" ? "red" : "blue";
  const A = season.alliances[alliance];
  const clamp = useCallback((v) => Math.max(0, Math.min(FIELD, Math.round(v * 10) / 10)), [FIELD]);

  const toSvg = useCallback((x, y) => ({ x: MARGIN + x * SCALE, y: MARGIN + (FIELD - y) * SCALE }), [SCALE, FIELD]);
  const toField = useCallback((sx, sy) => ({ x: (sx - MARGIN) / SCALE, y: FIELD - (sy - MARGIN) / SCALE }), [SCALE, FIELD]);
  const polyStr = (pts) => pts.map(([x, y]) => { const p = toSvg(x, y); return `${p.x},${p.y}`; }).join(" ");

  const presets = season.getPresets(alliance, robotSize);
  const setM = (k, v) => setMotion(m => ({ ...m, [k]: v }));

  /* ---- season switching ---- */
  const requestSeason = (id) => {
    if (id === seasonId) return;
    if (waypoints.length > 0) { setPendingSeason(id); return; }
    commitSeason(id);
  };
  const commitSeason = (id) => {
    const s = packs.find(p => p.id === id);
    const p = s.getPresets(alliance, robotSize)[0];
    setSeasonId(id); setWaypoints([]); setStartPreset(p.id);
    setStartPose({ x: p.x, y: p.y, heading: p.heading });
    setSelection({ type: "start" }); setPendingSeason(null); setNotice(null);
  };

  useEffect(() => {
    if (startPreset === "custom") return;
    const p = season.getPresets(alliance, robotSize).find(pp => pp.id === startPreset);
    if (p && p.x !== null) setStartPose(sp => ({ ...sp, x: p.x, y: p.y }));
  }, [robotSize, alliance, startPreset, season]);

  /* ---- pointer ---- */
  const svgCoords = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const k = VIEW / rect.width;
    return { x: (e.clientX - rect.left) * k, y: (e.clientY - rect.top) * k };
  };
  const handleFieldClick = (e) => {
    if (drag && drag.moved) return;
    const { x: sx, y: sy } = svgCoords(e);
    const f = toField(sx, sy);
    if (f.x < 0 || f.x > FIELD || f.y < 0 || f.y > FIELD) return;
    const wp = { id: nextId(), x: clamp(f.x), y: clamp(f.y), heading: 0, action: "none", actionParams: {} };
    if (insertAfter !== null) {
      setWaypoints(wps => { const c = [...wps]; c.splice(insertAfter + 1, 0, wp); return c; });
      setInsertAfter(null);
    } else setWaypoints(wps => [...wps, wp]);
    setSelection({ type: "wp", id: wp.id });
  };
  const handlePointMouseDown = (e, target, px, py) => {
    e.stopPropagation(); setSelection(target);
    const { x: sx, y: sy } = svgCoords(e);
    const pos = toSvg(px, py);
    setDrag({ target, offsetX: sx - pos.x, offsetY: sy - pos.y, moved: false });
  };
  const handleMouseMove = useCallback((e) => {
    if (!drag) return;
    const rect = svgRef.current.getBoundingClientRect();
    const k = VIEW / rect.width;
    const f = toField((e.clientX - rect.left) * k - drag.offsetX, (e.clientY - rect.top) * k - drag.offsetY);
    if (!drag.moved) setDrag(d => ({ ...d, moved: true }));
    if (drag.target.type === "start") {
      setStartPose(sp => ({ ...sp, x: clamp(f.x), y: clamp(f.y) }));
      setStartPreset("custom");
    } else {
      setWaypoints(wps => wps.map(wp => wp.id === drag.target.id ? { ...wp, x: clamp(f.x), y: clamp(f.y) } : wp));
    }
  }, [drag, toField, clamp, VIEW]);
  const handleMouseUp = useCallback(() => { setTimeout(() => setDrag(null), 0); }, []);
  useEffect(() => {
    if (!drag) return;
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    return () => { window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('mouseup', handleMouseUp); };
  }, [drag, handleMouseMove, handleMouseUp]);

  /* ---- edits ---- */
  const deleteWaypoint = (id) => {
    setWaypoints(wps => wps.filter(wp => wp.id !== id));
    if (selection.type === "wp" && selection.id === id) setSelection({ type: "start" });
  };
  const duplicateWaypoint = (i) => setWaypoints(wps => {
    const src = wps[i]; const out = [...wps];
    out.splice(i + 1, 0, { ...src, id: nextId(), x: clamp(src.x + 6), y: clamp(src.y + 6) });
    return out;
  });
  const updateWaypoint = (id, key, value) => setWaypoints(wps => wps.map(wp => wp.id === id ? { ...wp, [key]: value } : wp));
  const updateStart = (key, value) => { setStartPose(sp => ({ ...sp, [key]: value })); setStartPreset("custom"); };
  const applyPreset = (id) => {
    setStartPreset(id);
    const p = presets.find(pp => pp.id === id);
    if (p && p.x !== null) setStartPose({ x: p.x, y: p.y, heading: p.heading });
  };
  const moveWaypoint = (i, d) => {
    const ni = i + d; if (ni < 0 || ni >= waypoints.length) return;
    const arr = [...waypoints]; [arr[i], arr[ni]] = [arr[ni], arr[i]]; setWaypoints(arr);
  };
  const clearWaypoints = () => { setWaypoints([]); setSelection({ type: "start" }); setInsertAfter(null); };
  const switchAlliance = () => {
    const next = opponent; setAlliance(next);
    if (startPreset !== "custom") {
      const p = season.getPresets(next, robotSize).find(pp => pp.id === startPreset);
      if (p && p.x !== null) setStartPose({ x: p.x, y: p.y, heading: p.heading });
    }
  };
  const mirrorPath = () => {
    const M = season.mirror;
    setStartPose(sp => { const m = M.point(sp.x, sp.y); return { x: clamp(m.x), y: clamp(m.y), heading: M.heading(sp.heading) }; });
    setWaypoints(wps => wps.map(wp => {
      const m = M.point(wp.x, wp.y);
      return { ...wp, x: clamp(m.x), y: clamp(m.y), heading: M.heading(wp.heading),
        actionParams: wp.actionParams.tagId ? { ...wp.actionParams, tagId: M.tag(wp.actionParams.tagId) } : wp.actionParams };
    }));
    setAlliance(opponent); setStartPreset("custom");
  };

  /* ---- validation ---- */
  const startIssues = season.validateStart(startPose, { alliance, robotSize });
  const startLegal = startIssues.length === 0;

  const wpBlocked = {};
  waypoints.forEach(wp => {
    for (const o of season.obstacles)
      if (circleHitsPoly(wp.x, wp.y, robotSize / 2 - 1, o.poly)) { wpBlocked[wp.id] = o.name; break; }
  });

  // Swept-path check: a leg can pass through a structure with both ends clear.
  const legBlocked = {};
  {
    const chain = [startPose, ...waypoints];
    for (let i = 1; i < chain.length; i++) {
      const a = chain[i - 1], b = chain[i];
      for (const o of season.obstacles) {
        if (sweepHitsPoly(a.x, a.y, b.x, b.y, robotSize / 2 - 1, o.poly)) { legBlocked[chain[i].id] = o.name; break; }
      }
    }
  }
  const blockedCount = Object.keys(wpBlocked).length;
  const legBlockedCount = Object.keys(legBlocked).filter(k => !wpBlocked[k]).length;

  /* ---- timing ---- */
  const timing = estimatePath(startPose, waypoints, motion, season);
  const budget = season.autoSeconds;
  const overBudget = budget && timing.total > budget;

  /* ---- files ----
   * Sandboxed previews block file pickers and downloads, so every transfer
   * offers copy/paste as well. Same data either way. */
  const [transfer, setTransfer] = useState(null);

  const openExport = (title, filename, obj) =>
    setTransfer({ mode: "export", title, filename, text: JSON.stringify(obj, null, 2) });
  const openImport = (title, onLoad) =>
    setTransfer({ mode: "import", title, text: "", onLoad });

  const download = (obj, name) => {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  };
  const pathPayload = () => ({
    app: "PathPilot", formatVersion: 2, seasonId: season.id, seasonName: `${season.name} ${season.years}`,
    alliance, robotSize, motion, startPose, startPreset,
    waypoints: waypoints.map(({ id, ...r }) => r), exportedAt: new Date().toISOString(),
  });
  const exportPath = () => openExport("Save path", `pathpilot-${season.id}-${alliance}.json`, pathPayload());

  const exportPack = () => openExport("Season pack", `season-${season.id}.json`, season.dsl);

  const loadPathText = (text) => {
      try {
        const d = JSON.parse(text);
        if (d.app !== "PathPilot") return setNotice({ bad: true, msg: "Not a PathPilot path file." });
        if (!packs.some(p => p.id === d.seasonId)) return setNotice({ bad: true, msg: `No season "${d.seasonId}" loaded. Import that season pack first.` });
        if (d.seasonId !== seasonId) return setNotice({ bad: true, msg: `That path is for ${d.seasonName}. Switch to that season before loading it.` });
        setAlliance(d.alliance || "blue"); setRobotSize(d.robotSize || 18);
        if (d.motion) setMotion({ ...DEFAULT_MOTION, ...d.motion });
        setStartPreset(d.startPreset || "custom"); setStartPose(d.startPose);
        setWaypoints((d.waypoints || []).map(w => ({ ...w, id: nextId() })));
        setSelection({ type: "start" });
        setNotice({ bad: false, msg: `Loaded ${(d.waypoints || []).length} waypoints.` });
      } catch { setNotice({ bad: true, msg: "That is not valid JSON." }); }
  };

  const loadProfileText = (text) => {
      try {
        const p = JSON.parse(text);
        if (p.pathpilotProfile !== 1) {
          setNotice({ bad: true, msg: `Profile declares format ${p.pathpilotProfile}, this build reads 1.` });
          return;
        }
        setProfile(p);
        if (p.chassis && p.chassis.widthIn && p.chassis.lengthIn) {
          setRobotSize(Math.round(Math.max(p.chassis.widthIn, p.chassis.lengthIn)));
        }
        const n = (p.macros || []).length;
        const noJava = (p.macros || []).some(m => !m.java);
        const problems = [];
        if (p.odometry) {
          ["parallel", "perpendicular"].forEach(k => {
            const pod = p.odometry[k];
            if (pod && !pod.hardwareName) problems.push(`the ${k} pod has no motor on its port`);
            if (pod && !pod.ticksPerInch) problems.push(`the ${k} pod has no ticks/inch`);
          });
        }
        if (noJava) problems.push("macros carry no generated Java — re-export the profile from an up-to-date BotBuilder");
        const uncal = !p.odometry || !p.odometry.calibration || p.odometry.calibration.status !== "calibrated";
        setNotice({
          bad: problems.length > 0 || uncal,
          msg: `Loaded "${p.name}" — ${n} macro${n === 1 ? "" : "s"}.` +
               (problems.length ? ` Problems: ${problems.join("; ")}.` : "") +
               (uncal ? " Odometry is not calibrated, so path accuracy is unverified." : "")
        });
      } catch { setNotice({ bad: true, msg: "That is not valid JSON." }); }
  };

  const loadPackText = (text) => {
      let compiled;
      try {
        const dsl = JSON.parse(text);
        compiled = compileSeason(dsl);
      } catch (err) {
        return setNotice({ bad: true, msg: `Season pack rejected: ${err.message}` });
      }
      // Same verification the built-ins get: every preset legal at every size.
      const bad = [];
      for (let size = 12; size <= 18; size += 2)
        for (const al of ["blue", "red"])
          for (const p of compiled.getPresets(al, size)) {
            if (p.x === null) continue;
            const iss = compiled.validateStart({ x: p.x, y: p.y, heading: p.heading }, { alliance: al, robotSize: size });
            if (iss.length) bad.push(`${size}" ${al} "${p.id}": ${iss[0]}`);
          }
      compiled.imported = true;
      setPacks(ps => [...ps.filter(p => p.id !== compiled.id), compiled]);
      setNotice(bad.length
        ? { bad: true, msg: `Loaded "${compiled.name}", but ${bad.length} preset check(s) failed — e.g. ${bad[0]}. The pack is usable; its presets may not be legal.` }
        : { bad: false, msg: `Loaded season pack "${compiled.name}" — all preset checks passed.` });
      if (waypoints.length === 0) commitSeason(compiled.id); else setPendingSeason(compiled.id);
  };

  /* ---- codegen ---- */
  const opModeClassName = javaClassName(
    `${season.name} ${alliance} ${pathName || "Auto"}`.replace(/\s+/g, " ").trim());

  const generateCode = () => generateOpMode({
    className: opModeClassName,
    season, alliance, startPose, waypoints, motion, profile, timing,
  });

  /* ---- render helpers ---- */
  const op = (who) => (dimOpponent && who === opponent ? 0.28 : 1);
  const colorOf = (who) => (who ? season.alliances[who].color : "#9CA3AF");
  const G = season.geometry;

  const renderTiles = () => {
    const out = []; const n = Math.round(FIELD / TILE);
    for (let i = 1; i < n; i++) {
      const t = MARGIN + i * TILE * SCALE;
      out.push(<line key={`v${i}`} x1={t} y1={MARGIN} x2={t} y2={MARGIN + FIELD * SCALE} stroke="#3f3f46" strokeWidth="0.7" style={{ pointerEvents: "none" }} />,
               <line key={`h${i}`} x1={MARGIN} y1={t} x2={MARGIN + FIELD * SCALE} y2={t} stroke="#3f3f46" strokeWidth="0.7" style={{ pointerEvents: "none" }} />);
    }
    for (let i = 0; i < n; i++) {
      const cx = MARGIN + (i * TILE + TILE / 2) * SCALE;
      const ry = MARGIN + (FIELD - (i * TILE + TILE / 2)) * SCALE;
      out.push(<text key={`cl${i}`} x={cx} y={MARGIN + FIELD * SCALE + 16} textAnchor="middle" fill="#71717a" fontSize="11" fontWeight="600" style={{ pointerEvents: "none" }}>{season.columns[i]}</text>,
               <text key={`rn${i}`} x={MARGIN - 12} y={ry} textAnchor="middle" dominantBaseline="middle" fill="#71717a" fontSize="11" fontWeight="600" style={{ pointerEvents: "none" }}>{i + 1}</text>);
    }
    return out;
  };

  const renderPolys = () => (G.polygons || []).map(pg => {
    const isL = pg.kind === "launch";
    const c = isL ? "#E5E7EB" : colorOf(pg.owner);
    const lp = pg.labelAt ? toSvg(pg.labelAt[0], pg.labelAt[1]) : null;
    return (
      <g key={pg.key} opacity={pg.owner ? op(pg.owner) : 1} style={{ pointerEvents: "none" }}>
        <polygon points={polyStr(pg.points)} fill={isL ? "#D9E021" : c} fillOpacity={isL ? 0.11 : 0.35} stroke={c} strokeWidth="2" />
        {lp && <text x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="middle" fill={isL ? "#A3A34D" : "#fff"} fontSize={isL ? 9 : 8.5} fontWeight="700">{pg.label}</text>}
      </g>
    );
  });

  const renderRects = () => (G.rects || []).map(z => {
    const p = toSvg(z.x, z.y + z.height); const c = colorOf(z.owner);
    return (
      <g key={z.key} opacity={op(z.owner)} style={{ pointerEvents: "none" }}>
        <rect x={p.x} y={p.y} width={z.width * SCALE} height={z.height * SCALE} fill={c} fillOpacity="0.16" stroke={c} strokeWidth="1.4" strokeDasharray={z.dashed ? "5,3" : "none"} />
        {z.label && <text x={p.x + z.width * SCALE / 2} y={p.y + z.height * SCALE / 2} textAnchor="middle" dominantBaseline="middle" fill={c} fontSize="8.5" fontWeight="600">{z.label}</text>}
      </g>
    );
  });

  const renderTape = () => (G.tapeLines || []).map(t => {
    const a = toSvg(t.from[0], t.from[1]), b = toSvg(t.to[0], t.to[1]);
    return <line key={t.key} x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#E5E7EB" strokeWidth="2.5" opacity={op(t.owner)} style={{ pointerEvents: "none" }} />;
  });

  const renderMarkers = () => (G.markers || []).map((mk, i) => {
    const p = toSvg(mk.x, mk.y);
    return (
      <g key={`mk${i}`} style={{ pointerEvents: "none" }}>
        <line x1={p.x} y1={p.y} x2={p.x + mk.len * SCALE} y2={p.y} stroke="#E5E7EB" strokeWidth="2" />
        {showArtifacts && String(mk.motif).split("").map((ch, bi) => (
          <circle key={bi} cx={p.x + (2.5 + bi * 3.4) * SCALE} cy={p.y - 5} r="4.5" fill={(G.markerColors || {})[ch] || "#9CA3AF"} stroke="#18181b" strokeWidth="0.6" />
        ))}
      </g>
    );
  });

  const renderTags = () => {
    const out = season.tags.map(t => {
      const p = toSvg(t.x, t.y); const c = colorOf(t.owner);
      return (
        <g key={`tag${t.id}`} opacity={op(t.owner)} style={{ pointerEvents: "none" }}>
          <rect x={p.x - 11} y={p.y - 11} width={22} height={22} rx="3" fill="#fafafa" stroke={c} strokeWidth="2.5" />
          <text x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" fill="#18181b" fontSize="10" fontWeight="700">{t.id}</text>
        </g>
      );
    });
    season.offFieldTags.forEach((o, i) => {
      const p = toSvg(o.x, o.y);
      out.push(
        <g key={`off${i}`} style={{ pointerEvents: "none" }}>
          <rect x={p.x - 18} y={p.y - 30} width={36} height={22} rx="3" fill="#27272a" stroke="#a1a1aa" strokeWidth="1.5" />
          <text x={p.x} y={p.y - 19} textAnchor="middle" dominantBaseline="middle" fill="#d4d4d8" fontSize="8" fontWeight="600">{o.ids}</text>
          <text x={p.x} y={p.y - 36} textAnchor="middle" fill="#71717a" fontSize="8">{o.label}</text>
        </g>
      );
    });
    return out;
  };

  const renderAreas = () => ["red", "blue"].map(who => {
    const a = season.alliances[who]; const left = a.areaSide === "left";
    const x = left ? 4 : MARGIN + FIELD * SCALE + 6;
    const cx = x + (MARGIN - 10) / 2; const cy = MARGIN + 72 * SCALE;
    return (
      <g key={`aa${who}`} style={{ pointerEvents: "none" }}>
        <rect x={x} y={MARGIN + 40 * SCALE} width={MARGIN - 10} height={64 * SCALE} fill={a.color} fillOpacity={dimOpponent && who === opponent ? 0.08 : 0.22} rx="4" />
        <text x={cx} y={cy} textAnchor="middle" fill={a.color} fontSize="9" fontWeight="600" transform={`rotate(${left ? -90 : 90}, ${cx}, ${cy})`}>{a.label.toUpperCase()} AREA</text>
      </g>
    );
  });

  const headingLine = (pos, h, color, len) => (
    <line x1={pos.x} y1={pos.y} x2={pos.x + Math.cos((90 - h) * Math.PI / 180) * len} y2={pos.y - Math.sin((90 - h) * Math.PI / 180) * len} stroke={color} strokeWidth="2.5" strokeLinecap="round" />
  );

  const renderPath = () => {
    const out = []; const chain = [startPose, ...waypoints];
    for (let i = 0; i < chain.length - 1; i++) {
      const p1 = toSvg(chain[i].x, chain[i].y), p2 = toSvg(chain[i + 1].x, chain[i + 1].y);
      const badLeg = legBlocked[chain[i + 1].id];
      out.push(<line key={`ln${i}`} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                     stroke={badLeg ? "#EF4444" : (i === 0 ? "#F59E0B" : "#10B981")}
                     strokeWidth={badLeg ? 3 : 2.2} strokeDasharray="6,4" style={{ pointerEvents: "none" }} />);
    }
    const sp = toSvg(startPose.x, startPose.y); const sSel = selection.type === "start";
    out.push(
      <g key="start" style={{ cursor: "grab" }} onMouseDown={(e) => handlePointMouseDown(e, { type: "start" }, startPose.x, startPose.y)} onClick={(e) => e.stopPropagation()}>
        <circle cx={sp.x} cy={sp.y} r={robotSize / 2 * SCALE} fill={startLegal ? "rgba(245,158,11,0.10)" : "rgba(239,68,68,0.18)"} stroke={startLegal ? (sSel ? "#F59E0B" : "#92400E") : "#EF4444"} strokeWidth="1.6" strokeDasharray="4,4" />
        {headingLine(sp, startPose.heading, "#F59E0B", 24)}
        <rect x={sp.x - 14} y={sp.y - 14} width={28} height={28} rx="6" fill={sSel ? "#F59E0B" : "#B45309"} stroke={sSel ? "#FCD34D" : "#78350F"} strokeWidth="2.5" />
        <text x={sp.x} y={sp.y} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="13" fontWeight="bold" style={{ pointerEvents: "none" }}>S</text>
      </g>
    );
    waypoints.forEach((wp, i) => {
      const p = toSvg(wp.x, wp.y);
      const sel = selection.type === "wp" && selection.id === wp.id;
      const bad = !!wpBlocked[wp.id]; const legBad = !!legBlocked[wp.id];
      const act = season.actions.find(a => a.id === wp.action);
      out.push(
        <g key={wp.id} style={{ cursor: "grab" }} onMouseDown={(e) => handlePointMouseDown(e, { type: "wp", id: wp.id }, wp.x, wp.y)} onClick={(e) => e.stopPropagation()}>
          <circle cx={p.x} cy={p.y} r={robotSize / 2 * SCALE} fill={bad ? "rgba(239,68,68,0.18)" : (sel ? "rgba(16,185,129,0.10)" : "transparent")} stroke={bad ? "#EF4444" : (sel ? "#10B981" : "#6B7280")} strokeWidth={bad ? 1.6 : 1} strokeDasharray="4,4" opacity="0.7" />
          {headingLine(p, wp.heading, sel ? "#10B981" : "#9CA3AF", 20)}
          <circle cx={p.x} cy={p.y} r={sel ? 13 : 11} fill={bad ? "#B91C1C" : (legBad ? "#7C2D12" : (sel ? "#10B981" : "#374151"))} stroke={sel ? "#065F46" : "#6B7280"} strokeWidth="2.5" />
          <text x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="11" fontWeight="bold" style={{ pointerEvents: "none" }}>{i + 1}</text>
          {wp.action !== "none" && <text x={p.x + 15} y={p.y - 11} fontSize="12" style={{ pointerEvents: "none" }}>{act && act.icon}</text>}
        </g>
      );
    });
    return out;
  };

  const selectedWp = selection.type === "wp" ? waypoints.find(w => w.id === selection.id) : null;
  const selIdx = selectedWp ? waypoints.findIndex(w => w.id === selectedWp.id) : -1;

  const renderActionParams = (wp) => {
    const def = season.actions.find(a => a.id === wp.action);
    if (!def || !def.params) return null;
    const set = (k, v) => updateWaypoint(wp.id, "actionParams", { ...wp.actionParams, [k]: v });
    return def.params.map(p => {
      const cur = wp.actionParams[p.key] !== undefined ? wp.actionParams[p.key]
        : (p.default === "@myTag" ? A.tag : p.default);
      if (p.type === "tagId") return (
        <div key={p.key} style={{ marginBottom: "10px" }}>
          <label style={LB}>{p.label}</label>
          <select style={IN} value={cur || ""} onChange={(e) => set(p.key, Number(e.target.value))}>
            {season.tags.map(t => <option key={t.id} value={t.id}>{t.id} — {season.alliances[t.owner].label} goal</option>)}
            {season.tags.length === 0 && <option value="">no tags this season</option>}
          </select>
        </div>
      );
      if (p.type === "macro") {
        const chosen = macros.find(m => m.method === cur);
        const isEmpty = chosen && (chosen.stepCount === 0 || (chosen.java && chosen.java.body && chosen.java.body.length === 0));
        return (
        <div key={p.key} style={{ marginBottom: "10px" }}>
          <label style={LB}>{p.label}</label>
          <select style={IN} value={cur || ""} onChange={(e) => set(p.key, e.target.value)}>
            <option value="">{macros.length ? "Select macro..." : "No profile loaded"}</option>
            {macros.map(m => (
              <option key={m.method} value={m.method}>
                {m.name}{(m.stepCount === 0 || (m.java && m.java.body && m.java.body.length === 0)) ? "  (empty — does nothing)" : ""}
              </option>
            ))}
          </select>
          {isEmpty && (
            <div style={{ fontSize: "11px", color: "#FBBF24", marginTop: "4px", lineHeight: 1.5 }}>
              ⚠ "{chosen.name}" has no steps in BotBuilder, so this waypoint will arrive and do nothing.
            </div>
          )}
        </div>
      );
      }
      return (
        <div key={p.key} style={{ marginBottom: "10px" }}>
          <label style={LB}>{p.label}</label>
          <input type="number" style={IN} value={cur} step={p.step || 1} min={p.min} onChange={(e) => set(p.key, Number(e.target.value))} />
        </div>
      );
    });
  };

  const TABS = [
    { id: "path", label: "🗺️ Path" }, { id: "waypoints", label: "📋 Waypoints" },
    { id: "motion", label: "🎚️ Motion" }, { id: "code", label: "💻 Code" }, { id: "field", label: "📐 Field data" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#18181b", color: "#fafafa", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", padding: "1.5rem" }}>
      <div style={{ maxWidth: "1020px", margin: "0 auto" }}>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "1rem", flexWrap: "wrap", gap: "8px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "11px" }}>
            <img src={LOGO} alt="" width="40" height="40" style={{ display: "block", flexShrink: 0 }} />
            <div style={{ lineHeight: 1 }}>
              <div style={{ fontSize: "22px", fontWeight: 700, letterSpacing: "-0.3px" }}>
                <span style={{ color: "#E5E7EB" }}>Path</span><span style={{ color: "#3B82F6" }}>Pilot</span>
              </div>
              <div style={{ fontSize: "8.5px", color: "#52525b", letterSpacing: "2.2px", fontWeight: 600, marginTop: "3px" }}>DESIGN · DEPLOY · DRIVE</div>
            </div>
            <select value={seasonId} onChange={(e) => requestSeason(e.target.value)} style={{ ...IN, width: "auto", fontSize: "12px", padding: "5px 10px", marginLeft: "6px" }}>
              {packs.map(s => <option key={s.id} value={s.id}>{s.name}{s.years ? ` ${s.years}` : ""}</option>)}
            </select>
            {season.verified && <span title={season.source} style={{ fontSize: "11px", color: "#6EE7B7", background: "rgba(16,185,129,0.12)", border: "1px solid #065F46", borderRadius: "5px", padding: "2px 7px" }}>🔒 verified</span>}
            {season.imported && <span style={{ fontSize: "11px", color: "#FBBF24", background: "rgba(245,158,11,0.12)", border: "1px solid #B45309", borderRadius: "5px", padding: "2px 7px" }}>imported</span>}
          </div>
          <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
            <button onClick={switchAlliance} style={{ background: A.color, color: "white", border: "none", padding: "6px 12px", borderRadius: "6px", cursor: "pointer", fontSize: "13px" }}>
              {alliance === "blue" ? "🔵" : "🔴"} {A.label}
            </button>
            <button onClick={mirrorPath} style={BTN} title="Flip the path to the other alliance">⇄ Mirror</button>
            <button onClick={exportPath} style={BTN} title="Save this path as JSON">💾 Save path</button>
            <button onClick={() => openImport("Open path", loadPathText)} style={BTN} title="Load a saved path">📂 Open path</button>
            <button onClick={() => openImport("Load robot profile", loadProfileText)}
                    title="Robot profile exported from BotBuilder"
                    style={{ ...BTN, borderColor: profile ? "#065F46" : "#52525b", color: profile ? "#6EE7B7" : "#fafafa" }}>
              {profile ? `🤖 ${profile.name}` : "🤖 Load profile"}
            </button>
            <button onClick={clearWaypoints} style={BTN} title="Clear all waypoints">🗑️</button>
          </div>
        </div>

        {/* Transfer modal — file access is blocked in sandboxed previews, so
            every save/open also works by copy and paste. */}
        {transfer && (
          <div onClick={() => setTransfer(null)}
               style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex",
                        alignItems: "center", justifyContent: "center", zIndex: 50, padding: "20px" }}>
            <div onClick={(e) => e.stopPropagation()}
                 style={{ background: "#27272a", border: "1px solid #3f3f46", borderRadius: "12px",
                          padding: "18px", width: "min(720px, 100%)", maxHeight: "80vh",
                          display: "flex", flexDirection: "column", gap: "12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <strong style={{ fontSize: "15px" }}>{transfer.title}</strong>
                <button onClick={() => setTransfer(null)} style={{ ...BTN, padding: "2px 9px" }}>×</button>
              </div>

              {transfer.mode === "export" ? (
                <>
                  <div style={{ fontSize: "12px", color: "#a1a1aa" }}>
                    Download the file, or copy the text and keep it wherever you like.
                  </div>
                  <textarea readOnly value={transfer.text}
                            onFocus={(e) => e.target.select()}
                            style={{ ...IN, height: "300px", fontFamily: "ui-monospace, Menlo, monospace",
                                     fontSize: "11px", resize: "vertical" }} />
                  <div style={{ display: "flex", gap: "8px", justifyContent: "flex-end" }}>
                    <button onClick={() => { navigator.clipboard.writeText(transfer.text);
                                             setNotice({ bad: false, msg: "Copied to clipboard." }); }}
                            style={BTN}>📋 Copy</button>
                    <button onClick={() => {
                      try {
                        const blob = new Blob([transfer.text], { type: "application/json" });
                        const a = document.createElement("a");
                        a.href = URL.createObjectURL(blob);
                        a.download = transfer.filename;
                        a.click();
                        URL.revokeObjectURL(a.href);
                      } catch {
                        setNotice({ bad: true, msg: "Download blocked here — use Copy instead." });
                      }
                    }} style={BTN}>⬇ Download</button>
                  </div>
                </>
              ) : (
                <>
                  <div style={{ fontSize: "12px", color: "#a1a1aa" }}>
                    Paste the JSON below, or choose a file. Both do the same thing —
                    paste works even where file access is blocked.
                  </div>
                  <textarea autoFocus value={transfer.text}
                            onChange={(e) => setTransfer(t => ({ ...t, text: e.target.value }))}
                            placeholder="Paste JSON here..."
                            style={{ ...IN, height: "300px", fontFamily: "ui-monospace, Menlo, monospace",
                                     fontSize: "11px", resize: "vertical" }} />
                  <div style={{ display: "flex", gap: "8px", justifyContent: "space-between", alignItems: "center" }}>
                    <label style={{ ...BTN, display: "inline-block" }}>
                      📁 Choose file
